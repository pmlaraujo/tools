<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <title>Credit Management Calendar · essity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "Open Sans", Arial, sans-serif;
      color: #14293a;
      background: #f4f4f4;
      --ink: #14293a;
      --muted: #6c7079;
      --paper: #fff;
      --canvas: #f4f4f4;
      --line: #e7e8e8;
      --accent: #1f7bc0;
      --accent-dark: #055f9f;
      --accent-soft: #eaf3fa;
      --essity-pink: #f50082;
      --essity-pink-dark: #d90073;
      --heading: #00005a;
      --vacation: #1f7bc0;
      --vacation-soft: #eaf3fa;
      --home: #f50082;
      --home-soft: #ffebf5;
      --market-cover: #753b8c;
      --market-cover-soft: #f1e7f6;
      --compensation: #a9d8f2;
      --compensation-text: #00005a;
      --compensation-soft: #e8f5fc;
      --holiday: #a86e12;
      --holiday-soft: #fff5dc;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--canvas); }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #6d9df7; outline-offset: 2px; }
    .shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 42px; }
    .shell.wide-calendar { width: min(1600px, calc(100% - 32px)); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .view-switch { display: flex; flex-wrap: wrap; gap: 7px; }
    .view-button { padding: 9px 13px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--accent-dark); cursor: pointer; font-size: 12px; font-weight: 700; }
    .view-button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
    .view-button:hover:not([aria-pressed="true"]) { border-color: #84b9dd; background: var(--accent-soft); }
    .view-button[data-view="markets"] { border-color: var(--essity-pink); background: var(--essity-pink); color: #fff; }
    .view-button[data-view="markets"]:hover { border-color: var(--essity-pink-dark); background: var(--essity-pink-dark); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px 12px 12px 4px; background: var(--heading); color: #fff; font-size: 19px; font-weight: 800; }
    .brand-name { font-size: 17px; font-weight: 750; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .surface { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 12px 32px rgb(0 0 90 / 6%); }
    .page-intro { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: 12px; padding: 30px 34px 25px; border-bottom: 1px solid var(--line); }
    .page-intro-copy { min-width: 0; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; color: var(--heading); font-size: clamp(25px, 4vw, 34px); line-height: 1.15; }
    h2 { margin-bottom: 0; font-size: 21px; }
    .intro-copy { max-width: 680px; margin-bottom: 0; color: var(--muted); line-height: 1.55; }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 25px 34px 34px; }
    .team-entry { min-width: 0; }
    .team-country-list { margin: 8px 3px 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .team-country-list strong { color: var(--ink); }
    .team-year-button { display: inline-flex; align-items: center; margin: 8px 3px 0; padding: 7px 10px; border: 1px solid #b9d5e8; border-radius: 6px; background: var(--accent-soft); color: var(--accent-dark); cursor: pointer; font-size: 11px; font-weight: 700; }
    .team-year-button:hover { border-color: var(--accent); background: #dceefa; }
    .team-card { display: flex; width: 100%; min-height: 126px; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; text-align: left; cursor: pointer; transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease; }
    .team-card:hover { transform: translateY(-2px); border-color: #84b9dd; box-shadow: 0 8px 18px rgb(0 0 90 / 8%); }
    .team-card-main { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .team-icon { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border-radius: 11px; background: var(--accent-soft); color: var(--accent-dark); font-size: 15px; font-weight: 800; }
    .team-name { display: block; font-size: 18px; font-weight: 750; }
    .team-caption { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .team-count { flex: 0 0 auto; color: var(--muted); font-size: 11px; text-align: right; }
    .team-count strong { display: block; color: var(--ink); font-size: 21px; }
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 17px; color: var(--muted); font-size: 12px; }
    .crumb { padding: 0; border: 0; background: none; color: var(--accent-dark); cursor: pointer; font-weight: 700; }
    .crumb-separator { color: #99a6ae; }
    .subhead { padding: 22px 30px 20px; border-bottom: 1px solid var(--line); }
    .subhead-row { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .team-year-months-link { display: inline-block; margin-top: 12px; }
    .calendar-subhead-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: end; gap: 18px; }
    .subhead h1 { margin-bottom: 0; font-size: 27px; }
    .year-control, .month-control { display: inline-flex; align-items: center; gap: 8px; padding: 4px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .year-control button, .month-control button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 19px; }
    .year-control button:hover, .month-control button:hover { background: var(--canvas); }
    .year-value { min-width: 54px; text-align: center; font-weight: 750; }
    .month-control-label { min-width: 72px; color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
    .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; padding: 25px 30px 30px; }
    .month-card { display: flex; min-height: 96px; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; cursor: pointer; transition: border-color 140ms ease, background 140ms ease; }
    .month-card:hover { border-color: var(--accent); background: var(--accent-soft); }
    .month-name { color: var(--accent-dark); font-size: 17px; font-weight: 750; }
    .month-meta { color: var(--muted); font-size: 11px; }
    .team-year-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; padding: 24px 30px 30px; }
    .team-year-month { display: block; width: 100%; min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); text-align: left; cursor: pointer; }
    .team-year-month:hover, .team-year-month:focus-visible { border-color: #84b9dd; outline: 2px solid #84b9dd; outline-offset: 1px; }
    .team-year-month-readonly { cursor: default; }
    .team-year-month-readonly:hover { border-color: var(--line); outline: none; }
    .team-year-month-title { display: block; margin-bottom: 4px; color: var(--accent-dark); font-size: 14px; font-weight: 750; }
    .team-year-month-meta { display: block; margin-bottom: 9px; color: var(--muted); font-size: 10px; }
    .market-team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 25px 34px 34px; }
    .market-help { margin: 16px 30px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .market-legacy-note { margin: 12px 30px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: #f8f8f8; color: var(--muted); font-size: 11px; }
    .market-holiday-table { margin: 20px 30px 24px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .market-holiday-table h2 { margin: 0 0 10px; color: var(--heading); font-size: 16px; }
    .market-holiday-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .market-holiday-table th, .market-holiday-table td { padding: 8px 7px; border-bottom: 1px solid var(--line); text-align: left; }
    .market-holiday-table th { color: var(--muted); font-size: 11px; }
    .market-holiday-table tbody tr:last-child td { border-bottom: 0; }
    .market-holiday-table p { margin: 0; color: var(--muted); font-size: 12px; }
    .market-holiday-table-status { margin-bottom: 9px !important; }
    .market-holiday-legend-dot { color: var(--home); font-size: 14px; line-height: 1; }
    .market-day-trigger { display: inline-grid; width: 24px; height: 26px; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 5px; background: #f1f1f1; color: var(--muted); cursor: pointer; font-size: 8px; font-weight: 800; }
    .market-day-trigger:hover { border-color: var(--accent); }
    .market-day-trigger[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
    .market-day-trigger.vacation { border-color: var(--vacation); background: var(--vacation); color: #fff; cursor: not-allowed; }
    .market-day-more { margin-left: 1px; font-size: 7px; }
    .market-day-more.covered { color: var(--market-cover); font-weight: 800; }
    .employee-market-trigger { max-width: 100%; padding: 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-weight: 700; text-align: left; }
    .employee-market-trigger:hover { color: var(--accent-dark); text-decoration: underline; }
    .employee-market-trigger:disabled { cursor: not-allowed; }
    .market-day-display { display: inline-flex; min-height: 26px; align-items: center; justify-content: center; gap: 1px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
    .market-day-display.vacation { width: 24px; border-radius: 5px; background: var(--vacation); color: #fff; cursor: not-allowed; font-size: 11px; font-weight: 800; }
    .market-assignment-flag { display: inline-flex; min-width: 14px; height: 16px; align-items: center; justify-content: center; padding: 1px; border-radius: 3px; }
    .market-assignment-flag.covered { background: var(--market-cover-soft); box-shadow: inset 0 0 0 1px var(--market-cover); }
    .vacation-market-cell { overflow: visible; }
    .market-cover-trigger { position: absolute; top: 0; right: 0; z-index: 1; display: grid; width: 15px; height: 15px; place-items: center; padding: 0; border: 1px solid #fff; border-radius: 50%; background: #dff3e8; color: #17653b; cursor: pointer; font-size: 10px; font-weight: 800; line-height: 1; }
    .market-cover-trigger.missing { background: #fff0d6; color: #8a5d00; }
    .markets-column { position: sticky; left: 188px; z-index: 1; width: 168px; min-width: 168px; max-width: 168px; padding: 5px !important; background: #fff; text-align: left !important; vertical-align: middle; }
    .roster-table thead .markets-column { z-index: 5; background: #f4f4f4; }
    .person-markets { display: flex; max-height: 48px; flex-wrap: wrap; gap: 3px; overflow-y: auto; }
    .person-market-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 4px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-dark); font-size: 9px; white-space: nowrap; }
    .person-markets-empty { color: var(--muted); font-size: 10px; }
    .market-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 30px 22px; color: var(--muted); font-size: 11px; }
    .market-code-chip { display: inline-grid; min-width: 24px; height: 20px; place-items: center; padding: 0 4px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 8px; font-weight: 800; }
    .market-cover-code-chip { background: var(--market-cover); }
    .team-year-weekdays, .team-year-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
    .team-year-weekdays { margin-bottom: 3px; }
    .team-year-weekday { color: var(--muted); font-size: 8px; font-weight: 800; text-align: center; }
    .team-year-day { display: flex; min-width: 0; min-height: 38px; flex-direction: column; align-items: center; gap: 2px; padding: 2px 1px; border-radius: 4px; background: #fff; }
    .team-year-day.empty { visibility: hidden; }
    .team-year-day.weekend { background: #f1f1f1; color: var(--muted); }
    .team-year-day.holiday { box-shadow: inset 0 0 0 1px #c2942f; }
    .team-year-day-number { font-size: 9px; line-height: 1; }
    .team-year-marks { display: flex; width: 100%; flex-wrap: wrap; justify-content: center; gap: 1px; }
    .team-year-mark { display: inline-flex; min-width: 13px; align-items: center; justify-content: center; padding: 1px 2px; border-radius: 2px; font-size: 7px; font-weight: 800; line-height: 1; white-space: nowrap; }
    .team-year-mark.vacation { background: var(--vacation); color: #fff; }
    .team-year-mark.home { background: var(--home); color: #fff; }
    .team-year-mark.compensation { background: var(--compensation); color: var(--compensation-text); }
    .team-year-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 30px 24px; color: var(--muted); font-size: 11px; }
    .team-year-legend > span { display: inline-flex; align-items: center; gap: 6px; }
    .month-roster { margin: 0 30px 28px; padding: 16px 18px; border-radius: 9px; background: #f4f4f4; color: var(--muted); font-size: 12px; }
    .month-roster strong { color: var(--ink); }
    .month-roster ul { display: flex; flex-wrap: wrap; gap: 7px 18px; margin: 10px 0 0; padding-left: 18px; }
    .calendar-tools { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; padding: 18px 30px; border-bottom: 1px solid var(--line); }
    .employee-actions { display: flex; flex-wrap: nowrap; align-items: end; gap: 12px; }
    .employee-form { display: flex; flex: 0 0 auto; flex-wrap: nowrap; align-items: end; gap: 9px; }
    .employee-field label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
    .employee-field input { width: min(290px, 70vw); height: 39px; padding: 0 11px; border: 1px solid #6e7781; border-radius: 7px; background: #fff; color: var(--ink); }
    .primary-button { min-height: 39px; padding: 8px 13px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; font-weight: 700; }
    .primary-button:hover { background: var(--accent-dark); }
    .instruction { max-width: 440px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .holiday-panel { display: flex; align-items: flex-start; gap: 9px; margin: 16px 30px 0; padding: 11px 13px; border: 1px solid #f0dfb8; border-radius: 8px; background: var(--holiday-soft); color: #76500f; font-size: 12px; line-height: 1.45; }
    .holiday-panel strong { flex: 0 0 auto; }
    .table-wrap { overflow: auto; margin: 16px 16px 23px; border: 1px solid var(--line); border-radius: 9px; }
    .roster-table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
    .roster-table th, .roster-table td { height: 42px; padding: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
    .roster-table thead th { position: sticky; z-index: 2; background: #f4f4f4; color: var(--muted); font-weight: 700; }
    .roster-table thead .week-header th { top: 0; z-index: 4; height: 28px; background: #e9e9eb; font-size: 10px; }
    .roster-table thead .day-header th { top: 28px; z-index: 3; height: 48px; }
    .roster-table tr:last-child th, .roster-table tr:last-child td { border-bottom: 0; }
    .roster-table th:last-child, .roster-table td:last-child { border-right: 0; }
    .person-column { position: sticky; left: 0; z-index: 1; width: 188px; min-width: 188px; max-width: 188px; padding: 7px 10px !important; background: #fff; text-align: left !important; }
    .roster-table thead .person-column { background: #f4f4f4; }
    .roster-table thead .week-header .person-column { z-index: 6; }
    .roster-table thead .day-header .person-column { z-index: 5; }
    .week-group { white-space: nowrap; text-align: center !important; }
    .person-name { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
    .person-name > span { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .roster-table tbody tr.selected-person .person-column { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
    .roster-table tbody tr.selected-person .person-name > span { color: var(--accent-dark); }
    .remove-person { display: grid; width: 25px; height: 25px; flex: 0 0 auto; place-items: center; border: 1px solid #ead1d1; border-radius: 5px; background: #fff; color: #9c3d3d; cursor: pointer; font-size: 15px; }
    .remove-person:hover { background: #fff0f0; }
    .day-column { width: 32px; min-width: 32px; padding: 2px !important; }
    .day-column small { display: block; font-size: 9px; font-weight: 500; }
    .day-column.weekend, .mark-cell.weekend { background: #f1f1f1; }
    .day-column.holiday, .mark-cell.holiday { background: #fff8e7; }
    .mark-cell.market-holiday { box-shadow: inset 0 -3px 0 var(--home); }
    .market-holiday-indicator { position: absolute; top: 1px; right: 2px; color: var(--home); font-size: 8px; line-height: 1; pointer-events: none; }
    .holiday-dot { display: block; height: 5px; color: var(--holiday); font-size: 8px; line-height: 5px; }
    .mark-cell { position: relative; width: 32px; min-width: 32px; background: #fff; }
    .mark-trigger { display: inline-grid; width: 24px; height: 26px; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 5px; background: #f1f1f1; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 800; }
    .mark-trigger:hover:not(:disabled) { border-color: var(--accent); }
    .mark-trigger.vacation[aria-pressed="true"] { border-color: var(--vacation); background: var(--vacation); color: #fff; }
    .mark-trigger.home[aria-pressed="true"] { border-color: var(--home); background: var(--home); color: #fff; }
    .mark-trigger.compensation[aria-pressed="true"] { border-color: var(--compensation); background: var(--compensation); color: var(--compensation-text); }
    .mark-trigger:disabled { cursor: not-allowed; opacity: 1; }
    .mark-trigger[draggable="true"] { cursor: grab; }
    .mark-trigger.dragging { opacity: .45; }
    .mark-trigger.drag-target { outline: 2px dashed var(--accent); outline-offset: 1px; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgb(0 0 90 / 48%); }
    .mark-dialog { width: min(440px, 100%); padding: 21px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 18px 55px rgb(0 0 90 / 24%); }
    .mark-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .mark-dialog h2 { margin: 0 0 5px; color: var(--heading); font-size: 21px; }
    .mark-dialog-description, .current-mark { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .current-mark { margin: 0 0 12px; }
    .dialog-close { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; font-size: 19px; }
    .mark-choices { display: grid; gap: 8px; }
    .mark-choice { display: flex; width: 100%; align-items: center; gap: 11px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; cursor: pointer; }
    .market-choices { max-height: min(60vh, 500px); overflow-y: auto; padding-right: 4px; }
    .market-choice .mark-choice-code { background: var(--accent-soft); color: var(--accent-dark); font-family: "Segoe UI Emoji", sans-serif; font-size: 17px; }
    .market-choice[aria-pressed="true"] { border-color: var(--accent); background: #f8fbfc; }
    .market-cover-dialog { width: min(520px, 100%); }
    .market-cover-choices { display: grid; max-height: min(55vh, 430px); gap: 8px; overflow-y: auto; }
    .market-cover-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 1fr); align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); font-size: 12px; }
    .market-cover-row select { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font: inherit; }
    .market-cover-row select:disabled { background: #f2f2f2; color: var(--muted); }
    .mark-choice:hover:not(:disabled) { border-color: var(--accent); background: #f8fbfc; }
    .mark-choice:disabled { cursor: not-allowed; opacity: .48; }
    .mark-choice-code { display: grid; width: 29px; height: 29px; flex: 0 0 auto; place-items: center; border-radius: 6px; background: var(--vacation-soft); color: var(--vacation); font-size: 12px; font-weight: 800; }
    .mark-choice.home-choice .mark-choice-code { background: var(--home-soft); color: var(--heading); }
    .mark-choice.compensation-choice .mark-choice-code { background: var(--compensation-soft); color: var(--compensation-text); }
    .mark-choice strong, .mark-choice small { display: block; }

    function marketDistributionPage() {
      const team = teamById(state.team);

      const people = data.employees[team.id];
      const dailyMarks = dailyMarketMarksForMonth(team.id, state.year, state.month);
      const marketHolidayView = assignedMarketHolidayView(team.id, state.year, state.month);
      const marketSelections = new Map(people.map((person) => [
        normalizeName(person),
        marketsForPersonMonth(team.id, state.year, state.month, person)
      ]));
      const marketsByPerson = new Map();
      people.forEach((person) => {
        const personKey = normalizeName(person);
        marketsByPerson.set(personKey, new Set(marketSelections.get(personKey)));
      });
      dailyMarks.forEach((mark) => {
        const key = normalizeName(mark.person);
        if (!marketsByPerson.has(key)) marketsByPerson.set(key, new Set());
        marketsByPerson.get(key).add(mark.market);
      });
      const unassignedMarkets = [];
      people.forEach((owner) => {
        const ownerMarkets = marketSelections.get(normalizeName(owner)) || new Set();
        for (let day = 1; day <= monthDays(state.year, state.month); day += 1) {
          const date = dateKey(state.year, state.month, day);
          if (!hasVacationMark(team.id, owner, date)) continue;
          ownerMarkets.forEach((market) => {
            const cover = marketCoverFor(team.id, date, owner, market);
            if (!cover || hasVacationMark(team.id, cover.person, date)) {
              unassignedMarkets.push({ owner, market, date });
            }
          });
        }
      });
      const coverageNote = unassignedMarkets.length

      </section>`;

    function monthControl() {
      return `<div class="month-control" aria-label="Month navigation"><button type="button" data-month-offset="-1" aria-label="Previous month">‹</button><span class="month-control-label">${months[state.month]} ${state.year}</span><button type="button" data-month-offset="1" aria-label="Next month">›</button></div>`;
    }
    function monthHolidayPanel(holidays) {
      const monthHolidays = [...holidays.entries()].filter(([date]) => date.startsWith(`${state.year}-${String(state.month + 1).padStart(2, "0")}-`));
      const summary = monthHolidays.length
        ? monthHolidays.map(([date, name]) => `${Number(date.slice(-2))} — ${escapeHTML(name)}`).join(" · ")
        : "There are no national public holidays this month.";
      return `<div class="holiday-panel"><strong>National public holidays:</strong><span>${summary} <span class="muted">(municipal holidays are not included)</span></span></div>`;
    }
    function marketHolidayTable(view) {
      const monthPrefix = `${state.year}-${String(state.month + 1).padStart(2, "0")}-`;
      const entries = [];
      view.byCountry.forEach((holidays, code) => {
        const country = holidayCountryNames[code] || code;
        const prefix = `${country}: `;
        holidays.forEach((name, date) => {
          if (!date.startsWith(monthPrefix)) return;
          entries.push({ code, country, date, name: name.startsWith(prefix) ? name.slice(prefix.length) : name });
        });
      });
      entries.sort((a, b) => a.country.localeCompare(b.country, "en") || a.date.localeCompare(b.date));
      const rows = entries.map(({ code, country, date, name }) =>
        `<tr><td><span aria-hidden="true">${flagEmoji(code)}</span> ${escapeHTML(country)}</td><td><time datetime="${date}">${date.slice(8, 10)}/${date.slice(5, 7)}/${date.slice(0, 4)}</time></td><td>${escapeHTML(name)}</td></tr>`
      ).join("");
      const status = view.loading
        ? `<p class="market-holiday-table-status">Loading national holiday data…</p>`
        : view.errors.length
          ? `<p class="market-holiday-table-status" role="alert">Could not load all holiday data: ${view.errors.map(escapeHTML).join("; ")} <button type="button" class="crumb" data-action="retry-market-holidays">Retry</button></p>`
          : "";
      const emptyMessage = view.countryNames.size
        ? (view.errors.length ? "Holiday data is unavailable or incomplete." : "No national public holidays in assigned markets this month.")
        : "No markets are assigned this month.";
      const regionNote = view.marketNames.has("North America") || view.marketNames.has("Central America")
        ? `<p class="market-holiday-table-status">North America uses United States holidays; Central America covers Belize, Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua, and Panama.</p>`
        : "";
      const estimateNote = view.countryNames.has("AE")
        ? `<p class="market-holiday-table-status">UAE Islamic-calendar dates are estimates and may change with official moon sightings.</p>`
        : "";

      const table = rows

    function rosterTable(people, holidays) {
      const days = monthDays(state.year, state.month);
      const weekGroups = [];
      for (let day = 1; day <= days; day += 1) {
        const week = isoWeek(state.year, state.month, day);
        const key = `${week.year}-${week.number}`;
        const previous = weekGroups[weekGroups.length - 1];
        if (previous?.key === key) previous.days += 1;
        else weekGroups.push({ ...week, key, days: 1 });
      }

        `<th scope="colgroup" class="week-group" colspan="${week.days}" aria-label="Week ${week.number} of ${week.year}">W${String(week.number).padStart(2, "0")} · ${week.year}</th>`

        const weekend = isWeekend(state.year, state.month, day);
        const weekday = weekdays[weekdayIndex(state.year, state.month, day)];

    function annualSummary(people) {

      const holidays = getHolidays(state.year);

          total.home += 1;

        state.pendingMarket = {
          team: team.id,
          person,
          year: state.year,
          month: state.month,
          markets: [...marketsForPersonMonth(team.id, state.year, state.month, person)]
        };
        render();
        app.querySelector('[data-action="select-market"]:not(:disabled)')?.focus();
        return;
      } else if (button.dataset.action === "choose-market-cover") {
        const team = teamById(state.team);
        const person = data.employees[state.team]?.find((name) => normalizeName(name) === normalizeName(button.dataset.person));
        if (state.view !== "markets" || !team?.countries?.length || !person ||
            !validDate(button.dataset.date) || !hasVacationMark(team.id, person, button.dataset.date) ||
            !marketsForPersonMonth(team.id, state.year, state.month, person).size) return;
        state.pendingMarketCover = { team: team.id, person, date: button.dataset.date };
        render();
        app.querySelector('[data-action="set-market-cover"]:not(:disabled)')?.focus();
        return;
      } else if (button.dataset.action === "select-market") {
        setMarket(button.dataset.market);
        return;
      } else if (button.dataset.action === "clear-market") {
        clearMarket();
        return;
      } else if (button.dataset.action === "close-market") {
        closeMarketDialog();
        return;
      } else if (button.dataset.action === "save-market-selection") {
        saveMarketSelection();
        return;
      } else if (button.dataset.action === "close-market-cover") {
        closeMarketCoverDialog();
        return;
      } else if (button.dataset.action === "retry-market-holidays") {
        marketHolidayViews.delete(`${state.team}:${state.year}:${state.month}`);
        render();
        return;
      } else if (button.dataset.action === "choose-mark") {
        if (normalizeName(state.selectedEmployee) !== normalizeName(button.dataset.person)) return;
        state.pendingMark = { person: button.dataset.person, date: button.dataset.date };
        render();
        app.querySelector('[data-action="select-mark"]:not(:disabled)')?.focus();
        return;
      } else if (button.dataset.action === "select-mark") {
        setMark(button.dataset.kind);
        return;
      } else if (button.dataset.action === "clear-mark") {
        clearMark();
        return;
      } else if (button.dataset.action === "close-mark") {
        closeMarkDialog();
        return;
      } else if (button.dataset.action === "show-year") {
        state.annualPerson = button.dataset.person;
        state.selectedEmployee = "";
        state.employeeInput = "";
        render();
        app.querySelector('[data-action="close-year"]')?.focus();
        return;
      } else if (button.dataset.action === "close-year") {
        closeEmployeeYear();
        return;
      } else if (button.dataset.yearMonth !== undefined) {
        const month = Number(button.dataset.yearMonth);
        const person = state.annualPerson;
        if (!Number.isInteger(month) || month < 0 || month >= months.length || !person) return;
        state.month = month;
        state.annualPerson = "";
        render();
        const row = [...app.querySelectorAll("[data-person-row]")]
          .find((item) => normalizeName(item.dataset.personRow) === normalizeName(person));
        row?.scrollIntoView({ block: "center" });
        [...app.querySelectorAll('[data-action="show-year"]')]
          .find((item) => normalizeName(item.dataset.person) === normalizeName(person))
          ?.focus({ preventScroll: true });
        return;
      } else if (button.dataset.team) {
        state.team = button.dataset.team;
        state.selectedEmployee = "";
        state.employeeInput = "";
        state.page = "months";
      } else if (button.dataset.marketTeam) {
        state.team = button.dataset.marketTeam;
        state.page = "market-distribution";
        state.pendingMarket = null;
      } else if (button.dataset.page === "market-teams") {
        state.team = "";
        state.page = "market-teams";
        state.pendingMarket = null;
      } else if (button.dataset.teamYear) {
        state.team = button.dataset.teamYear;
        state.selectedEmployee = "";
        state.employeeInput = "";
        state.page = "team-year";
      } else if (button.dataset.page === "teams") {
        state.page = "teams";
        state.team = "";
        state.selectedEmployee = "";
        state.employeeInput = "";
      } else if (button.dataset.page === "months") {
        state.page = "months";
      } else if (button.dataset.teamMonth !== undefined) {
        const month = Number(button.dataset.teamMonth);
        if (!Number.isInteger(month) || month < 0 || month >= months.length) return;
        state.month = month;
        state.page = "calendar";
        render();
        window.scrollTo(0, 0);
        return;
      } else if (button.dataset.year) {
        state.year += Number(button.dataset.year);
      } else if (button.dataset.month !== undefined) {
        state.month = Number(button.dataset.month);
        state.page = "calendar";
      } else if (button.dataset.monthOffset) {
        const next = new Date(Date.UTC(state.year, state.month + Number(button.dataset.monthOffset), 1));
        state.year = next.getUTCFullYear();
        state.month = next.getUTCMonth();
      } else if (button.dataset.action === "remove-person") {
        removeEmployee(button.dataset.person);
        return;
      } else {
        return;
      }
      render();
    });
    app.addEventListener("dragstart", (event) => {
      const button = event.target.closest('[data-action="choose-mark"]');
      if (!button?.draggable || !button.dataset.markKind ||
          normalizeName(state.selectedEmployee) !== normalizeName(button.dataset.person)) {
        event.preventDefault();
        return;
      }
      state.dragMark = { person: button.dataset.person, date: button.dataset.date, kind: button.dataset.markKind };
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", button.dataset.date);
      button.classList.add("dragging");
    });
    app.addEventListener("dragover", (event) => {
      const target = event.target.closest('[data-action="choose-mark"]');
      const previous = app.querySelector(".mark-trigger.drag-target");
      if (previous && previous !== target) previous.classList.remove("drag-target");
      if (!canMoveMarkTo(target)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      target.classList.add("drag-target");
    });
    app.addEventListener("dragleave", (event) => {
      const target = event.target.closest(".mark-trigger");
      if (target && !target.contains(event.relatedTarget)) target.classList.remove("drag-target");
    });
    app.addEventListener("drop", (event) => {
      if (!state.dragMark) return;
      event.preventDefault();
      const target = event.target.closest('[data-action="choose-mark"]');
      if (!canMoveMarkTo(target)) {
        if (vacationMoveExceedsQuota(target)) {
          const quota = vacationQuotaFor(state.team, Number(state.dragMark.date.slice(0, 4)), state.dragMark.person);
          window.alert(`Moving this vacation would exceed the annual quota of ${quota} ${quota === 1 ? "day" : "days"}.`);
        }
        return;
      }
      const source = state.dragMark;
      const sourceMark = data.marks.find((mark) =>
        mark.team === state.team && mark.date === source.date && normalizeName(mark.person) === normalizeName(source.person)
      );
      if (!sourceMark) return;
      const marks = data.marks.map((mark) => mark === sourceMark ? { ...mark, date: target.dataset.date } : mark);
      state.dragMark = null;
      saveAndRender({ employees: data.employees, marks });
    });
    app.addEventListener("dragend", (event) => {
      event.target.closest(".mark-trigger")?.classList.remove("dragging", "drag-target");
      app.querySelectorAll(".mark-trigger.drag-target").forEach((button) => button.classList.remove("drag-target"));
      state.dragMark = null;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (state.pendingMark) closeMarkDialog();
      else if (state.pendingMarketCover) closeMarketCoverDialog();
      else if (state.pendingMarket) closeMarketDialog();
      else if (state.annualPerson) closeEmployeeYear();
    });
    app.addEventListener("change", (event) => {
      const quotaInput = event.target.closest('[data-action="set-vacation-quota"]');
      if (quotaInput) {
        setVacationQuota(quotaInput.dataset.person, Number(quotaInput.dataset.year), quotaInput.value, quotaInput);
        return;
      }
      const select = event.target.closest('[data-action="set-market-cover"]');
      if (!select) return;
      setMarketCover(select.dataset.market, select.value);
    });
    app.addEventListener("input", (event) => {
      const input = event.target.closest("#employee-name");
      if (!input) return;
      state.employeeInput = input.value;
      const selected = matchingEmployee(input.value, data.employees[state.team]);
      const selectedChanged = normalizeName(state.selectedEmployee) !== normalizeName(selected);
      state.selectedEmployee = selected;
      const button = app.querySelector("[data-employee-submit]");
      if (button) {
        button.textContent = selected ? "Select to mark" : "Add";
        button.disabled = !storageUsable || !input.value.trim();
      }
      if (selectedChanged) {
        app.querySelectorAll("[data-person-row]").forEach((row) => {
          const isSelected = normalizeName(row.dataset.personRow) === normalizeName(selected);
          row.classList.toggle("selected-person", isSelected);
          row.querySelectorAll('[data-action="choose-mark"]').forEach((markButton) => {
            const [year, month, day] = markButton.dataset.date.split("-").map(Number);
            const label = isSelected ? markButton.dataset.selectedLabel : markButton.dataset.unselectedLabel;
            markButton.disabled = !storageUsable || !isSelected;
            markButton.draggable = storageUsable && isSelected && Boolean(markButton.dataset.markKind) && !isWeekend(year, month - 1, day);
            markButton.setAttribute("aria-label", label);
            markButton.title = label;
          });
        });
      }
    });
    app.addEventListener("submit", (event) => {
      const form = event.target.closest('[data-form="employee"]');
      if (!form) return;
      event.preventDefault();
      const input = form.elements.name;
      addEmployee(input.value);
    });
    render();
    initializeSharedCalendar().catch((error) => {
      console.error("Could not initialize the shared calendar.", error);
      storageUsable = false;
      syncStatus = error.message || "Could not initialize the shared calendar.";
      syncStatusKind = "error";
      render();
    });
  </script>
</body>
</html>
