<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf4f5">
  <title>Gestão de Equipas · Calendário DRCR</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222;
      --muted: #54616c;
      --paper: #fff;
      --canvas: #edf4f5;
      --line: #dee2e6;
      --green: #009f98;
      --green-dark: #007179;
      --green-soft: #edf4f5;
      --home-accent: #273c4e;
      --home-soft: #edf4f5;
      --coral: #c85c43;
      --coral-soft: #fbe8e0;
      --gold: #d4a63b;
      --gold-soft: #fff3d4;
      --radius: 8px;
      font-family: "NovoBancoText", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background-color: var(--canvas);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #007179; outline-offset: 3px; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 42px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 25px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px 12px 12px 4px; color: white; background: var(--green); font-size: 20px; font-weight: 800; }
    .brand-name { font-size: 20px; font-weight: 700; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .mode-switch { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .mode-button { min-height: 38px; padding: 8px 13px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .mode-button[aria-pressed="true"] { color: white; background: var(--green); }
    .mode-home .mode-button[aria-pressed="true"] { background: var(--home-accent); }
    .surface { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 14px 35px rgb(39 60 78 / 8%); animation: arrive 240ms ease-out both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .page-intro { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: 12px; padding: 36px 40px 30px; border-bottom: 1px solid var(--line); }
    .page-intro-copy { min-width: 0; }
    .page-intro h1 { font-weight: 700; color: var(--green-dark); }
    .direction-card .team-icon { background: var(--green-soft); color: var(--green-dark); }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .mode-home .eyebrow { color: var(--home-accent); }
    h1, h2, p { margin-top: 0; }
    h1, h2 { font-family: inherit; }
    h1 { margin-bottom: 8px; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; }
    .intro-copy { max-width: 620px; margin-bottom: 0; color: var(--muted); line-height: 1.55; }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 26px 40px 34px; }
    .team-card { display: flex; min-height: 104px; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 21px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; text-align: left; cursor: pointer; transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease; }
    .team-card:hover { transform: translateY(-2px); border-color: #8ccbc7; box-shadow: 0 8px 18px rgb(39 60 78 / 7%); }
    .team-card-copy { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .team-icon { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green-dark); font-size: 14px; font-weight: 800; }
    .team-card:nth-child(2) .team-icon { background: #dff3f2; color: var(--green-dark); }
    .team-card:nth-child(3) .team-icon { background: var(--home-soft); color: var(--home-accent); }
    .team-card:nth-child(4) .team-icon { background: #e7eef1; color: var(--home-accent); }
    .team-title { display: inline-block; max-width: 100%; padding: 5px 9px; border-radius: 7px; background: rgb(224, 224, 224); color: #404040; font-size: 17px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .team-caption { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .team-count { min-width: 61px; text-align: right; }
    .team-count strong { display: block; font-size: 21px; }
    .team-count span { color: var(--muted); font-size: 11px; }
    .arrow { color: #808b94; font-size: 20px; }
    .legacy-access { padding: 0 34px 26px; color: var(--muted); font-size: 12px; }
    .legacy-access button { padding: 0; border: 0; background: none; color: var(--green-dark); cursor: pointer; font: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .subhead { padding: 23px 34px 20px; border-bottom: 1px solid var(--line); }
    .breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    .crumb { padding: 0; border: 0; background: none; color: var(--green-dark); cursor: pointer; font-weight: 700; }
    .crumb[disabled] { color: var(--muted); cursor: default; font-weight: 400; }
    .crumb-separator { color: #808b94; }
    .subhead-row { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .calendar-subhead-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 320px) auto; align-items: end; gap: 18px; }
    .subhead h1 { margin-bottom: 0; font-size: 29px; }
    .year-control { display: inline-flex; align-items: center; gap: 12px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .year-control button { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 18px; }
    .year-control button:hover { background: var(--canvas); }
    .year-value { min-width: 43px; text-align: center; font-size: 14px; font-weight: 800; }
    .month-stepper { display: inline-flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .month-stepper button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 20px; }
    .month-stepper button:hover { background: var(--canvas); }
    .month-stepper-label { padding: 0 5px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 25px 34px 34px; }
    .month-card { display: flex; min-height: 100px; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: white; text-align: center; cursor: pointer; transition: border-color 140ms ease, background 140ms ease; }
    .month-card:hover { border-color: var(--green); background: var(--green-soft); }
    .month-name, .mini-month-title { display: inline-block; padding: 5px 9px; border-radius: 7px; background: #007179; color: white; }
    .month-name { font-size: 19px; font-weight: 700; }
    .month-meta { color: var(--muted); font-size: 11px; }
    .calendar-tools { display: flex; align-items: center; justify-content: flex-end; gap: 20px; padding: 12px 34px; border-bottom: 1px solid var(--line); }
    .person-field { width: min(320px, 100%); }
    .person-field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 800; }
    .person-field input { width: 100%; height: 41px; padding: 0 12px; border: 1px solid #ccd8dc; border-radius: 7px; background: #fff; color: var(--ink); }
    .mode-hint { max-width: 280px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; text-align: right; }
    .calendar-wrap { padding: 20px 34px 29px; }
    .weekdays, .days-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
    .weekdays { margin-bottom: 7px; }
    .weekday { padding: 7px 3px; color: var(--muted); font-size: 10px; font-weight: 800; text-align: center; text-transform: uppercase; }
    .day-cell { position: relative; display: flex; min-width: 0; min-height: 78px; flex-direction: column; align-items: flex-start; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 7px; background: white; text-align: left; cursor: pointer; transition: border-color 120ms ease, background 120ms ease; }
    .day-cell:hover { border-color: var(--green); }
    .mode-home .day-cell:hover { border-color: var(--home-accent); }
    .day-cell.empty { visibility: hidden; pointer-events: none; }
    .day-cell.weekend { background: #f5f8f8; }
    .day-cell.holiday { border-color: #e8cc82; background: #fffaf0; }
    .mode-vac .day-cell.vacation-unavailable:not(.has-selected-mark) { cursor: not-allowed; opacity: .7; }
    .mode-vac .day-cell.vacation-unavailable:not(.has-selected-mark):hover { border-color: var(--line); }
    .overlap-badge { position: absolute; top: 3px; right: 3px; z-index: 1; display: grid; min-width: 17px; height: 17px; place-items: center; padding: 0 3px; border-radius: 5px; background: #b94a36; color: white; font-size: 9px; font-weight: 800; }
    .day-cell.today .day-number { display: grid; width: 23px; height: 23px; place-items: center; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--gold-soft); }
    .day-number { font-size: 12px; font-weight: 800; }
    .holiday-label { display: block; max-width: 100%; overflow: hidden; padding: 2px 4px; border-radius: 4px; background: var(--gold-soft); color: #74591c; font-size: 9px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .day-markers { display: flex; flex-wrap: wrap; gap: 3px; }
    .marker { display: inline-grid; min-width: 22px; height: 20px; place-items: center; padding: 0 4px; border-radius: 5px; background: var(--person-color, var(--green-soft)); color: var(--person-ink, var(--green-dark)); font-size: 9px; font-weight: 800; }
    .marker-draggable { cursor: grab; touch-action: none; user-select: none; }
    .marker-draggable:active { cursor: grabbing; }
    .day-cell.drop-target { outline: 2px dashed var(--green); outline-offset: -4px; }
    .mode-home .day-cell.drop-target { outline-color: var(--home-accent); }
    .marker-selected { outline: 2px solid currentColor; outline-offset: 1px; opacity: 1; }
    .day-cell.has-selected-mark { box-shadow: inset 0 0 0 2px var(--green); }
    .mode-home .day-cell.has-selected-mark { box-shadow: inset 0 0 0 2px var(--home-accent); }
    .roster-person { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .person-swatch { display: inline-grid; width: 25px; height: 25px; flex: 0 0 auto; place-items: center; border-radius: 6px; background: var(--person-color); color: var(--person-ink); font-size: 9px; font-weight: 800; }
    .person-filter { display: flex; width: 100%; align-items: center; gap: 8px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
    .person-filter[aria-pressed="true"] > span:last-child { color: var(--green-dark); text-decoration: underline; text-underline-offset: 3px; }
    .person-row { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .person-row .person-filter { width: auto; min-width: 0; flex: 1; }
    .person-delete { flex: 0 0 auto; padding: 6px 8px; border: 1px solid #e6b9ad; border-radius: 5px; background: white; color: #9f432e; cursor: pointer; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .person-delete:hover { background: var(--coral-soft); }
    .day-cell.has-mark { border-color: #8ccbc7; background: #e8f7f6; }
    .mode-home .day-cell.has-mark { border-color: #aabac4; background: var(--home-soft); }
    .calendar-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .legend { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .mode-home .legend-dot { background: var(--home-accent); }
    .person-summary { margin: 0; padding: 12px 34px; border-bottom: 1px solid var(--line); background: #e8f7f6; color: var(--green-dark); font-size: 13px; font-weight: 800; }
    .mode-home .person-summary { background: var(--home-soft); color: var(--home-accent); }
    .person-summary:empty { display: none; }
    .year-roster { margin: 0 34px; padding: 20px 0 26px; border-top: 1px solid var(--line); }
    .year-roster-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .year-roster h2 { margin-bottom: 0; font-size: 20px; }
    .year-roster table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .year-roster th, .year-roster td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
    .year-roster th { color: var(--muted); font-size: 11px; }
    .year-roster td { font-size: 13px; }
    .year-roster th:first-child, .year-roster td:first-child { width: 42%; padding-left: 0; font-weight: 700; }
    .year-roster th:last-child, .year-roster td:last-child { width: 58%; text-align: center; }
    .year-roster.home-summary th:first-child, .year-roster.home-summary td:first-child { width: 58%; }
    .year-roster.home-summary th:last-child, .year-roster.home-summary td:last-child { width: 42%; }
    .vacation-balance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 5px; }
    .balance-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2; }
    .balance-stat strong { font-size: 13px; }
    .balance-stat small, .quota-edit { color: var(--muted); font-size: 9px; }
    .balance-over strong, .balance-over small { color: var(--coral); }
    .quota-edit { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .quota-edit input { width: 58px; max-width: 100%; height: 28px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); font-size: 11px; text-align: center; }
    .roster-note, .roster-empty { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .holiday-legend { display: inline-flex; align-items: center; gap: 7px; }
    .holiday-legend-mark { width: 10px; height: 10px; border: 1px solid #e8cc82; border-radius: 3px; background: var(--gold-soft); }
    .calendar-legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .calendar-legend > span { display: inline-flex; align-items: center; gap: 5px; }
    .calendar-state-mark { width: 10px; height: 10px; border: 1px solid var(--line); border-radius: 3px; }
    .calendar-state-mark.today { border-color: #e6c46e; background: var(--gold-soft); }
    .calendar-state-mark.state-weekend { background: #f0f2ed; }
    .calendar-state-mark.state-holiday { border-color: #e8cc82; background: var(--gold-soft); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; display: flex; max-width: calc(100vw - 40px); align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #43534b; border-radius: 8px; background: var(--ink); color: white; box-shadow: 0 8px 26px rgb(22 38 29 / 22%); }
    .toast span { font-size: 13px; line-height: 1.4; }
    .toast button { min-height: 32px; padding: 6px 10px; border: 0; border-radius: 5px; background: var(--gold-soft); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 800; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgb(25 36 31 / 55%); }
    .vacation-dialog { width: min(1040px, 100%); max-height: min(90vh, 900px); overflow: auto; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
    .vacation-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 12px; }
    .vacation-dialog h2 { margin: 0 0 7px; font-size: 25px; }
    .vacation-dialog-summary { margin: 0; color: var(--muted); font-size: 13px; }
    .dialog-close { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: white; cursor: pointer; font-size: 20px; }
    .year-calendar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .mini-month { display: block; width: 100%; min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 7px; appearance: none; background: white; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .mini-month:hover, .mini-month:focus-visible { border-color: #8ccbc7; outline: 2px solid #8ccbc7; outline-offset: 1px; }
    .mini-month-title { margin: 0 0 9px; font-size: 15px; font-weight: 700; }
    .mini-weekdays, .mini-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .mini-weekdays { margin-bottom: 4px; }
    .mini-weekday { color: var(--muted); font-size: 9px; font-weight: 800; text-align: center; }
    .mini-day { display: grid; aspect-ratio: 1; min-width: 0; place-items: center; border-radius: 4px; color: var(--ink); font-size: 10px; }
    .mini-day.empty { visibility: hidden; }
    .mini-day.weekend { color: #808b94; background: #f5f8f8; }
    .mini-day.holiday { position: relative; box-shadow: inset 0 0 0 1px #c2942f; }
    .mini-day.holiday::after { position: absolute; right: 2px; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: #9b7018; content: ""; }
    .mini-day.marked { background: var(--person-color); color: var(--person-ink); font-weight: 800; }
    .vacation-dialog-legend { display: flex; align-items: center; gap: 7px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .vacation-legend-swatch { width: 13px; height: 13px; border-radius: 4px; background: var(--person-color); }
    .holiday-legend-swatch { width: 10px; height: 10px; border: 1px solid #c2942f; border-radius: 50%; background: var(--gold-soft); }
    @media (max-width: 700px) { .year-calendar-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 480px) { .vacation-dialog { padding: 17px 12px; } .year-calendar-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .mini-month { padding: 8px; } }
    .storage-note { padding: 13px 34px; border-top: 1px solid var(--line); background: #f5f8f8; color: var(--muted); font-size: 11px; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 560px); padding-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 13px; }
      .mode-switch { width: 100%; }
      .mode-button { flex: 1; }
      .page-intro { grid-template-columns: 1fr; gap: 16px; padding: 27px 22px 23px; }
      .team-grid { gap: 9px; padding: 18px 18px 23px; }
      .team-card { min-height: 95px; gap: 8px; padding: 13px; }
      .team-card-copy { gap: 9px; }
      .team-icon { width: 38px; height: 38px; }
      .team-title { font-size: 15px; }
      .team-caption { font-size: 10px; }
      .team-count { min-width: 36px; }
      .team-count strong { font-size: 18px; }
      .team-count span { font-size: 9px; }
      .legacy-access { padding: 0 18px 22px; }
      .subhead { padding: 18px 19px 16px; }
      .subhead-row { align-items: flex-start; flex-direction: column; }
      .calendar-subhead-row { grid-template-columns: 1fr; align-items: start; gap: 14px; }
      .subhead h1 { font-size: 26px; }
      .month-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 18px; }
      .month-card { min-height: 86px; padding: 11px; }
      .month-name { font-size: 17px; }
      .calendar-tools { align-items: stretch; flex-direction: column; gap: 12px; padding: 17px 19px; }
      .person-field { width: 100%; }
      .mode-hint { max-width: none; text-align: left; }
      .person-summary { padding: 12px 19px; }
      .year-roster { margin: 0 19px; }
      .year-roster th, .year-roster td { padding: 8px 4px; font-size: 11px; }
      .year-roster th:first-child, .year-roster td:first-child { width: 36%; padding-left: 0; }
      .calendar-wrap { padding: 15px 12px 22px; }
      .weekdays, .days-grid { gap: 4px; }
      .weekday { font-size: 9px; }
      .day-cell { min-height: 58px; gap: 5px; padding: 6px; }
      .day-number { font-size: 11px; }
      .marker { min-width: 19px; height: 17px; font-size: 8px; }
      .storage-note { padding: 12px 19px; }
    }
    @media (max-width: 390px) {
      .team-card { align-items: flex-start; flex-direction: column; }
      .team-count { display: none; }
      .team-card-copy { align-items: flex-start; flex-direction: column; }
      .day-cell { min-height: 51px; padding: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <script>
    const areas = [
      { id: "GT", name: "Gabinete Técnico" },
      { id: "EJ", name: "Extra Judicial", subteams: [
        { id: "EJ-Outsourcing", name: "Outsourcing" },
        { id: "EJ-EmpresasExternas", name: "Empresas Externas" },
        { id: "EJ-PreContencioso", name: "Pré Contencioso" }
      ] },
      { id: "Jud", name: "Judicial", subteams: [
        { id: "Jud-Negocios", name: "Negócios" },
        { id: "Jud-Particulares", name: "Particulares" }

        .map((entry) => entry.date));
      const holidays = getHolidays(year);
      const offset = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = Array.from({ length: offset }, () => `<span class="mini-day empty" aria-hidden="true"></span>`);
      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const weekday = (offset + day - 1) % 7;
        const showMark = personMarks.has(date);
        const markClass = showMark ? "marked" : "";
        const markLabel = mode === "ferias" ? "Férias" : "Home office";
        const classes = ["mini-day", weekday > 4 ? "weekend" : "", holidays.has(date) ? "holiday" : "", markClass].filter(Boolean).join(" ");
        const holidayTitle = holidays.get(date)?.name || "";
        const title = [holidayTitle, showMark ? `${markLabel} marcada(s)` : ""].filter(Boolean).join(" · ");
        const accessibleLabel = [`${day} de ${months[month]}`, holidayTitle ? `Feriado nacional: ${holidayTitle}` : "", showMark ? `${markLabel} marcada(s)` : ""].filter(Boolean).join(", ");
        cells.push(`<span class="${classes}" aria-label="${escapeHTML(accessibleLabel)}"${title ? ` title="${escapeHTML(title)}"` : ""}>${day}</span>`);
      }
      const modeLabel = mode === "ferias" ? "Férias" : "Home Office";
      return `<button type="button" class="mini-month" data-person-month="${month}" aria-label="Abrir ${months[month]} para ${modeLabel} de ${escapeHTML(person)}"><span class="mini-month-title">${months[month]}</span><span class="mini-weekdays">${["S", "T", "Q", "Q", "S", "S", "D"].map((day, index) => `<span class="mini-weekday" aria-label="${["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"][index]}">${day}</span>`).join("")}</span><span class="mini-days" style="${personColorStyle(color)}">${cells.join("")}</span></button>`;
    }
    function openPersonMonth(month) {
      state.month = Number(month);
      state.person = "";
      state.vacationDetailPerson = "";
      state.page = "calendar";
      render();
      document.querySelector("#person-name")?.focus();
    }
    function vacationDetailModal() {
      if (!state.vacationDetailPerson) return "";
      const person = state.vacationDetailPerson;
      const personKey = person.toLocaleLowerCase("pt-PT");
      const summary = yearSummary(state.team, state.year).find((item) => item.name.toLocaleLowerCase("pt-PT") === personKey);
      const color = personColorMap(state.year).get(personKey);
      const showingVacation = state.mode === "ferias";
      const usedDays = showingVacation ? summary?.vacationDays || 0 : summary?.homeDays || 0;
      const quota = summary?.quota;
      const balance = quota === undefined ? "Quota não definida" : `${Math.max(0, quota - usedDays)} dias restantes de ${quota}`;
      const modeLabel = showingVacation ? "Férias" : "Home office";
      const countLabel = showingVacation
        ? `${usedDays} ${usedDays === 1 ? "dia útil de férias marcado" : "dias úteis de férias marcados"} · ${balance}`
        : `${usedDays} ${usedDays === 1 ? "dia de home office marcado" : "dias de home office marcados"}`;
      const titleLabel = showingVacation ? "Férias anuais" : "Home office anual";
      const monthsGrid = months.map((_, month) => personMonthCalendar(state.team, state.year, month, person, color, state.mode)).join("");
      return `<div class="dialog-backdrop" data-detail-backdrop><section class="vacation-dialog" role="dialog" aria-modal="true" aria-labelledby="vacation-detail-title"><div class="vacation-dialog-header"><div><h2 id="vacation-detail-title">${titleLabel} · ${escapeHTML(person)} · ${state.year}</h2><p class="vacation-dialog-summary">${countLabel}</p></div><button class="dialog-close" data-close-detail aria-label="Fechar resumo">×</button></div><div class="year-calendar-grid">${monthsGrid}</div><div class="vacation-dialog-legend"><span class="vacation-legend-swatch" style="${personColorStyle(color)}"></span>Dias de ${modeLabel.toLocaleLowerCase("pt-PT")} marcados<span class="holiday-legend-swatch" aria-hidden="true"></span>Feriado nacional</div></section></div>`;
    }
    function calendarDays() {
      const firstDay = new Date(state.year, state.month, 1).getDay();
      const offset = (firstDay + 6) % 7;
      const totalDays = new Date(state.year, state.month + 1, 0).getDate();
      const today = new Date();
      const holidays = getHolidays(state.year);
      const colors = personColorMap(state.year);
      const personInitials = initialsForPeople(knownPeople(state.team));
      const selectedPerson = state.person.trim().toLocaleLowerCase("pt-PT");
      const cells = Array.from({ length: offset }, () => `<div class="day-cell empty" aria-hidden="true"></div>`);
      for (let day = 1; day <= totalDays; day += 1) {
        const key = dateKey(day);
        const marked = entries.filter((entry) => entry.team === state.team && entry.date === key && entry.mode === state.mode);
        const vacationOverlap = new Set(entries.filter((entry) => entry.team === state.team && entry.date === key && entry.mode === "ferias").map((entry) => entry.person.toLocaleLowerCase("pt-PT"))).size;
        const hasSelectedMark = selectedPerson && marked.some((entry) => entry.person.toLocaleLowerCase("pt-PT") === selectedPerson);
        const hasSelectedVacationMark = selectedPerson && entries.some((entry) => entry.team === state.team && entry.date === key && entry.mode === "ferias" && entry.person.toLocaleLowerCase("pt-PT") === selectedPerson);
        const vacationUnavailable = state.mode === "ferias" && !isWorkingDate(key, holidays);
        const holiday = holidays.get(key);
        const isToday = today.getFullYear() === state.year && today.getMonth() === state.month && today.getDate() === day;
        const isWeekend = (offset + day - 1) % 7 > 4;
        const markedNames = marked.length ? marked.map((entry) => entry.person).join(", ") : "Sem marcações";
        const overlapMessage = vacationOverlap > 1 ? `${vacationOverlap} colaboradores de férias` : "";
        const unavailableMessage = vacationUnavailable ? "Férias não disponíveis em fins de semana ou feriados" : "";
        const title = [holiday?.name, overlapMessage, markedNames, unavailableMessage].filter(Boolean).join(" · ");
        const chips = marked.slice(0, 3).map((entry) => {
          const personKey = entry.person.toLocaleLowerCase("pt-PT");
          const color = colors.get(personKey);
          const isSelected = personKey === selectedPerson;
          const markerClass = isSelected ? " marker-selected" : "";
          const title = isSelected ? `${entry.person} · Arraste para outro dia para mover` : entry.person;
          const initialsLabel = personInitials.get(personKey) || initials(entry.person);
          return `<span class="marker${markerClass}${isSelected ? " marker-draggable" : ""}" data-date="${key}" data-person="${escapeHTML(entry.person)}" style="${personColorStyle(color)}" title="${escapeHTML(title)}">${escapeHTML(initialsLabel)}</span>`;
        }).join("");
        const overflow = marked.length > 3 ? `<span class="marker" title="Mais ${marked.length - 3}">+${marked.length - 3}</span>` : "";
        const holidayLabel = holiday ? `<span class="holiday-label" title="${escapeHTML(holiday.name)}">${escapeHTML(holiday.shortName)}</span>` : "";
        const overlapBadge = vacationOverlap > 1 ? `<span class="overlap-badge" aria-label="${overlapMessage}" title="${overlapMessage}">${vacationOverlap}</span>` : "";
        cells.push(`<button class="day-cell${marked.length ? " has-mark" : ""}${hasSelectedMark ? " has-selected-mark" : ""}${vacationUnavailable ? " vacation-unavailable" : ""}${vacationOverlap > 1 ? " has-overlap" : ""}${isWeekend ? " weekend" : ""}${holiday ? " holiday" : ""}${isToday ? " today" : ""}" data-day="${day}" aria-disabled="${Boolean(vacationUnavailable && !hasSelectedVacationMark)}" aria-label="${day} de ${months[state.month]}${holiday ? `, feriado: ${escapeHTML(holiday.name)}` : ""}${overlapMessage ? `, ${overlapMessage}` : ""}${unavailableMessage ? `, ${unavailableMessage}` : ""}, ${escapeHTML(markedNames)}" title="${escapeHTML(title)}"><span class="day-number">${day}</span>${overlapBadge}${holidayLabel}<span class="day-markers">${chips}${overflow}</span></button>`);
      }
      return cells.join("");
    }
    function calendarPage() {
      const monthEntries = matchingEntries(state.team, state.year, state.month, state.mode);
      const total = state.mode === "ferias" ? countWorkingDays(monthEntries, state.year) : monthEntries.length;
      const name = teamName(state.team);
      return `<section class="surface">
        <div class="subhead">${breadcrumbs(`${months[state.month]} ${state.year}`)}<div class="subhead-row calendar-subhead-row"><div><p class="eyebrow">Equipa ${escapeHTML(name)} · ${currentModeLabel()}</p><h1>${months[state.month]} ${state.year}</h1></div><div class="person-field"><label for="person-name">Nome para identificar as marcações</label><input id="person-name" list="known-people" type="text" maxlength="60" autocomplete="name" placeholder="Ex.: Ana Silva" value="${escapeHTML(state.person)}"><datalist id="known-people">${knownPeople(state.team).map((person) => `<option value="${escapeHTML(person)}"></option>`).join("")}</datalist></div>${monthStepper()}</div></div>
        <div class="calendar-tools"><p class="mode-hint">Arraste o seu ícone para outro dia para mover a marcação. Pode escolher um nome já registado.</p></div>
        <p class="person-summary" id="person-summary" aria-live="polite">${escapeHTML(personSummaryText())}</p>
        <div class="calendar-wrap"><div class="weekdays">${weekdays.map((day) => `<div class="weekday">${day}</div>`).join("")}</div><div class="days-grid">${calendarDays()}</div>
          <div class="calendar-footer"><span class="legend"><span class="legend-dot"></span>${modeDayLabel(state.mode, total)} neste mês</span><span class="calendar-legend"><span><i class="calendar-state-mark today"></i>Hoje</span><span><i class="calendar-state-mark state-weekend"></i>Fim de semana</span><span><i class="calendar-state-mark state-holiday"></i>Feriado nacional</span></span></div>
        </div>
        ${yearRoster(state.team, state.year)}
        <div class="storage-note">Dados guardados apenas neste navegador e dispositivo.</div>
      </section>`;
    }
    function render() {
      app.className = `shell mode-${state.mode === "home" ? "home" : "vac"}`;
      const page = state.page === "teams" ? teamPage() : state.page === "subteams" ? subteamPage() : state.page === "months" ? monthPage() : calendarPage();
      const toast = state.toastMessage ? `<div class="toast" role="status" aria-live="polite"><span>${escapeHTML(state.toastMessage)}</span>${state.toastUndo && lastAction ? `<button data-undo="true">Anular</button>` : ""}</div>` : "";
      app.innerHTML = `${header()}${page}${toast}${vacationDetailModal()}`;
    }

    app.addEventListener("pointerdown", (event) => {
      const marker = event.target.closest(".marker-draggable[data-date][data-person]");
      if (!marker || state.page !== "calendar" || marker.dataset.person.toLocaleLowerCase("pt-PT") !== state.person.trim().toLocaleLowerCase("pt-PT")) return;
      pointerDrag = { pointerId: event.pointerId, date: marker.dataset.date, person: marker.dataset.person, startX: event.clientX, startY: event.clientY, active: false };
    });
    document.addEventListener("pointermove", (event) => {
      if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
      if (!pointerDrag.active && Math.hypot(event.clientX - pointerDrag.startX, event.clientY - pointerDrag.startY) < 6) return;
      pointerDrag.active = true;
      event.preventDefault();
      const dayCell = document.elementFromPoint(event.clientX, event.clientY)?.closest(".day-cell[data-day]");
      app.querySelectorAll(".drop-target").forEach((cell) => {
        if (cell !== dayCell) cell.classList.remove("drop-target");
      });
      dayCell?.classList.add("drop-target");
    }, { passive: false });
    document.addEventListener("pointerup", (event) => {
      if (!pointerDrag || pointerDrag.pointerId !== event.pointerId) return;
      const source = pointerDrag;
      pointerDrag = null;
      app.querySelectorAll(".drop-target").forEach((cell) => cell.classList.remove("drop-target"));
      if (!source.active) return;
      event.preventDefault();
      const dayCell = document.elementFromPoint(event.clientX, event.clientY)?.closest(".day-cell[data-day]");
      if (!dayCell) return;
      suppressDayClick = dayCell.dataset.day;
      clearTimeout(suppressDayClickTimer);
      suppressDayClickTimer = setTimeout(() => { suppressDayClick = ""; }, 500);
      moveMark(source.date, dateKey(Number(dayCell.dataset.day)), source.person);
    });
    document.addEventListener("pointercancel", () => {
      pointerDrag = null;
      app.querySelectorAll(".drop-target").forEach((cell) => cell.classList.remove("drop-target"));
    });

    app.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (event.target.matches("[data-detail-backdrop]")) {
        state.vacationDetailPerson = "";
        state.person = "";
        render();
        return;
      }
      if (button?.dataset.personMonth !== undefined) {
        openPersonMonth(button.dataset.personMonth);
        return;
      }
      if (!button) return;
      if (button.dataset.day === suppressDayClick) {
        event.preventDefault();
        suppressDayClick = "";
        clearTimeout(suppressDayClickTimer);
        return;
      }
      if (button.hasAttribute("data-close-detail")) {
        state.vacationDetailPerson = "";
        state.person = "";
        render();
        return;
      }
      if (button.dataset.personFilter) {
        state.vacationDetailPerson = button.dataset.personFilter;
        state.person = button.dataset.personFilter;
        render();
        document.querySelector(".dialog-close")?.focus();
        return;
      }
      if (button.dataset.undo) {
        undoLastAction();
        return;
      }
      if (button.dataset.deletePerson) {
        const person = button.dataset.deletePerson;
        const confirmed = window.confirm(`Eliminar ${person} e todas as marcações de Férias e Home Office da equipa ${teamName(state.team)}?`);
        if (!confirmed) return;
        const personKey = person.toLocaleLowerCase("pt-PT");
        entries = entries.filter((entry) => entry.team !== state.team || entry.person.toLocaleLowerCase("pt-PT") !== personKey);
        saveEntries();
        showToast(`Todas as marcações de ${person} foram eliminadas da equipa ${teamName(state.team)}.`);
        render();
        return;
      }
      if (button.dataset.mode) {
        state.mode = button.dataset.mode;
        if (state.team && !teamSupportsMode(state.team, state.mode)) {
          state.team = "";
          state.area = "";
          state.page = "teams";
          state.vacationDetailPerson = "";
        }
      }
      if (button.dataset.area) {
        const area = areas.find((item) => item.id === button.dataset.area);
        if (area) {
          state.area = area.id;
          if (area.subteams) state.page = "subteams";
          else { state.team = area.id; state.page = "months"; }
        }
      }
      if (button.dataset.subteam) {
        state.team = button.dataset.subteam;
        state.area = areaForTeam(state.team)?.id || "";
        state.page = "months";
      }
      if (button.dataset.team) {
        state.team = button.dataset.team;
        state.area = areaForTeam(state.team)?.id || "";
        state.page = "months";
      }
      if (button.dataset.month !== undefined) { state.month = Number(button.dataset.month); state.person = ""; state.page = "calendar"; }
      if (button.dataset.monthOffset !== undefined) {
        const adjacentMonth = new Date(state.year, state.month + Number(button.dataset.monthOffset), 1);
        state.year = adjacentMonth.getFullYear();
        state.month = adjacentMonth.getMonth();
        state.person = "";
      }
      if (button.dataset.page) state.page = button.dataset.page;
      if (button.dataset.year) state.year += Number(button.dataset.year);
      if (button.dataset.day) {
        const person = state.person.trim();
        if (!person) {
          const input = document.querySelector("#person-name");
          input.focus();
          input.setCustomValidity("Indique o seu nome antes de marcar dias.");
          input.reportValidity();
          return;
        }
        const date = dateKey(Number(button.dataset.day));
        const existingIndex = entries.findIndex((entry) => entry.team === state.team && entry.date === date && entry.person.toLocaleLowerCase("pt-PT") === person.toLocaleLowerCase("pt-PT"));
        const previous = existingIndex >= 0 ? { ...entries[existingIndex] } : null;
        const removed = existingIndex >= 0 && entries[existingIndex].mode === state.mode;
        if (state.mode === "ferias" && !removed && !isWorkingDate(date, getHolidays(state.year))) {
          showToast("Não é possível marcar férias em fins de semana ou feriados.");
          render();
          return;
        }
        if (removed) entries.splice(existingIndex, 1);
        else if (existingIndex >= 0) entries[existingIndex] = { ...entries[existingIndex], mode: state.mode, person, status: "aprovada" };
        else entries.push({ team: state.team, date, person, mode: state.mode, status: "aprovada" });
        saveEntries();
        lastAction = { team: state.team, date, person, previous };
        let message = removed ? "Marcação retirada." : "Marcação registada.";
        if (state.mode === "ferias") {
          const personYear = yearSummary(state.team, state.year).find((entry) => entry.name.toLocaleLowerCase("pt-PT") === person.toLocaleLowerCase("pt-PT"));
          if (personYear?.quota !== undefined && personYear.vacationDays > personYear.quota) message = `Quota excedida em ${personYear.vacationDays - personYear.quota} dia(s).`;
        }
        showToast(message, true);
      }
      render();
    });
    app.addEventListener("input", (event) => {
      if (event.target.id === "person-name") {
        state.person = event.target.value;
        event.target.setCustomValidity("");
        const selectedPerson = state.person.trim().toLocaleLowerCase("pt-PT");
        app.querySelectorAll(".marker[data-person]").forEach((marker) => {
          const isSelected = marker.dataset.person.toLocaleLowerCase("pt-PT") === selectedPerson;
          marker.classList.toggle("marker-selected", isSelected);
          marker.classList.toggle("marker-draggable", isSelected);
          marker.title = isSelected ? `${marker.dataset.person} · Arraste para outro dia para mover` : marker.dataset.person;
        });
        document.querySelector("#person-summary").textContent = personSummaryText();
      }
    });
    app.addEventListener("change", (event) => {
      const input = event.target;
      if (input.classList.contains("quota-input")) {
        const value = input.value.trim();
        const key = quotaKey(input.dataset.quotaTeam, Number(input.dataset.quotaYear), input.dataset.quotaPerson);
        if (value === "") delete vacationQuotas[key];
        else {
          const quota = Number(value);
          if (!Number.isInteger(quota) || quota < 0 || quota > 366) {
            input.setCustomValidity("Indique uma quota entre 0 e 366 dias.");
            input.reportValidity();
            return;
          }
          vacationQuotas[key] = quota;
        }
        saveVacationQuotas();
        showToast("Quota de férias guardada.");
        render();
        return;
      }
    });
    document.addEventListener("keydown", (event) => {
      const monthButton = event.target.closest("[data-person-month]");
      if (monthButton && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openPersonMonth(monthButton.dataset.personMonth);
        return;
      }
      if (event.key === "Escape" && state.vacationDetailPerson) {
        state.vacationDetailPerson = "";
        state.person = "";
        render();
      }
    });
    render();
  </script>
</body>
</html>
