<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4ec">
  <title>Gestão de Equipas · Calendário DRCR</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b27;
      --muted: #64716b;
      --paper: #fbfcf8;
      --canvas: #f0f3eb;
      --line: #dce3d8;
      --green: #237b62;
      --green-dark: #175642;
      --green-soft: #e0f1e8;
      --coral: #c85c43;
      --coral-soft: #fbe8e0;
      --gold: #d4a63b;
      --gold-soft: #fff3d4;
      --radius: 8px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background-color: var(--canvas);
      background-image: radial-gradient(#cbd6c8 0.65px, transparent 0.65px);
      background-size: 15px 15px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e6b84f; outline-offset: 3px; }
    .shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 42px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 25px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px 12px 12px 4px; color: white; background: var(--green); font-size: 20px; font-weight: 800; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .mode-switch { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
    .mode-button { min-height: 38px; padding: 8px 13px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .mode-button[aria-pressed="true"] { color: white; background: var(--green); }
    .mode-home .mode-button[aria-pressed="true"] { background: var(--coral); }
    .surface { overflow: hidden; border: 1px solid #dfe5dc; border-radius: 12px; background: var(--paper); box-shadow: 0 14px 35px rgb(34 54 43 / 8%); animation: arrive 240ms ease-out both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .page-intro { padding: 36px 40px 30px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .mode-home .eyebrow { color: var(--coral); }
    h1, h2, p { margin-top: 0; }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; }
    h1 { margin-bottom: 8px; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; }
    .intro-copy { max-width: 620px; margin-bottom: 0; color: var(--muted); line-height: 1.55; }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 26px 40px 34px; }
    .team-card { display: flex; min-height: 104px; align-items: center; justify-content: space-between; gap: 16px; padding: 19px 21px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; text-align: left; cursor: pointer; transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease; }
    .team-card:hover { transform: translateY(-2px); border-color: #9cbeaa; box-shadow: 0 8px 18px rgb(34 54 43 / 7%); }
    .team-card-copy { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .team-icon { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green-dark); font-size: 14px; font-weight: 800; }
    .team-card:nth-child(2) .team-icon { background: var(--gold-soft); color: #80621f; }
    .team-card:nth-child(3) .team-icon { background: var(--coral-soft); color: #9f432e; }
    .team-card:nth-child(4) .team-icon { background: #e8ebfa; color: #46548e; }
    .team-title { display: block; font-size: 17px; font-weight: 800; }
    .team-caption { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .team-count { min-width: 61px; text-align: right; }
    .team-count strong { display: block; font-size: 21px; }
    .team-count span { color: var(--muted); font-size: 11px; }
    .arrow { color: #8d9991; font-size: 20px; }
    .subhead { padding: 23px 34px 20px; border-bottom: 1px solid var(--line); }
    .breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    .crumb { padding: 0; border: 0; background: none; color: var(--green-dark); cursor: pointer; font-weight: 700; }
    .crumb[disabled] { color: var(--muted); cursor: default; font-weight: 400; }
    .crumb-separator { color: #a4aea7; }
    .subhead-row { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .subhead h1 { margin-bottom: 0; font-size: 29px; }
    .year-control { display: inline-flex; align-items: center; gap: 12px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .year-control button { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 18px; }
    .year-control button:hover { background: var(--canvas); }
    .year-value { min-width: 43px; text-align: center; font-size: 14px; font-weight: 800; }
    .month-stepper { display: inline-flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .month-stepper button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 20px; }
    .month-stepper button:hover { background: var(--canvas); }
    .month-stepper-label { padding: 0 5px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 25px 34px 34px; }
    .month-card { display: flex; min-height: 100px; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: white; text-align: center; cursor: pointer; transition: border-color 140ms ease, background 140ms ease; }
    .month-card:hover { border-color: #9cbeaa; background: #f8fbf6; }
    .month-name { font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 700; }
    .month-meta { color: var(--muted); font-size: 11px; }
    .calendar-tools { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 20px 34px; border-bottom: 1px solid var(--line); }
    .person-field { width: min(320px, 100%); }
    .person-field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 800; }
    .person-field input { width: 100%; height: 41px; padding: 0 12px; border: 1px solid #cbd6ca; border-radius: 7px; background: #fff; color: var(--ink); }
    .responsible-settings { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 16px 34px; border-bottom: 1px solid var(--line); background: #f8faf5; }
    .responsible-settings .person-field { flex: 1 1 260px; }
    .responsible-settings button, .approval-actions button { min-height: 38px; padding: 8px 12px; border: 0; border-radius: 6px; background: var(--green); color: white; cursor: pointer; font-size: 12px; font-weight: 800; }
    .approval-panel { padding: 18px 34px; border-top: 1px solid var(--line); }
    .approval-panel h2 { margin: 0 0 6px; font-size: 20px; }
    .approval-note { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .approval-list { display: grid; gap: 8px; }
    .approval-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .approval-item-copy { font-size: 13px; line-height: 1.45; }
    .approval-item-copy small { display: block; color: var(--muted); }
    .approval-actions { display: flex; gap: 7px; }
    .approval-actions[hidden] { display: none; }
    .approval-actions .reject-button { border: 1px solid #e6b9ad; background: white; color: #9f432e; }
    .marker.pending { border: 1px dashed #9b7018; background: var(--gold-soft); color: #74591c; }
    .day-cell.has-pending { border-style: dashed; }
    .approval-empty { margin: 0; color: var(--muted); font-size: 12px; }
    .mode-hint { max-width: 280px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; text-align: right; }
    .calendar-wrap { padding: 20px 34px 29px; }
    .weekdays, .days-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
    .weekdays { margin-bottom: 7px; }
    .weekday { padding: 7px 3px; color: var(--muted); font-size: 10px; font-weight: 800; text-align: center; text-transform: uppercase; }
    .day-cell { position: relative; display: flex; min-width: 0; min-height: 78px; flex-direction: column; align-items: flex-start; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 7px; background: white; text-align: left; cursor: pointer; transition: border-color 120ms ease, background 120ms ease; }
    .day-cell:hover { border-color: var(--green); }
    .mode-home .day-cell:hover { border-color: var(--coral); }
    .day-cell.empty { visibility: hidden; pointer-events: none; }
    .day-cell.weekend { background: #f8f9f5; }
    .day-cell.holiday { border-color: #e8cc82; background: #fffaf0; }
    .overlap-badge { position: absolute; top: 3px; right: 3px; z-index: 1; display: grid; min-width: 17px; height: 17px; place-items: center; padding: 0 3px; border-radius: 5px; background: #b94a36; color: white; font-size: 9px; font-weight: 800; }
    .day-cell.today .day-number { display: grid; width: 23px; height: 23px; place-items: center; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--gold-soft); }
    .day-number { font-size: 12px; font-weight: 800; }
    .holiday-label { display: block; max-width: 100%; overflow: hidden; padding: 2px 4px; border-radius: 4px; background: var(--gold-soft); color: #74591c; font-size: 9px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .day-markers { display: flex; flex-wrap: wrap; gap: 3px; }
    .marker { display: inline-grid; min-width: 22px; height: 20px; place-items: center; padding: 0 4px; border-radius: 5px; background: var(--person-color, var(--green-soft)); color: var(--person-ink, var(--green-dark)); font-size: 9px; font-weight: 800; }
    .marker-selected { outline: 2px solid currentColor; outline-offset: 1px; opacity: 1; }
    .day-cell.has-selected-mark { box-shadow: inset 0 0 0 2px var(--green); }
    .mode-home .day-cell.has-selected-mark { box-shadow: inset 0 0 0 2px var(--coral); }
    .roster-person { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .person-swatch { display: inline-grid; width: 25px; height: 25px; flex: 0 0 auto; place-items: center; border-radius: 6px; background: var(--person-color); color: var(--person-ink); font-size: 9px; font-weight: 800; }
    .person-filter { display: flex; width: 100%; align-items: center; gap: 8px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
    .person-filter[aria-pressed="true"] > span:last-child { color: var(--green-dark); text-decoration: underline; text-underline-offset: 3px; }
    .day-cell.has-mark { border-color: #9bc7ae; background: #f0f8f2; }
    .mode-home .day-cell.has-mark { border-color: #e5a491; background: #fff5f1; }
    .calendar-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .legend { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .mode-home .legend-dot { background: var(--coral); }
    .person-summary { margin: 0; padding: 12px 34px; border-bottom: 1px solid var(--line); background: #f0f8f2; color: var(--green-dark); font-size: 13px; font-weight: 800; }
    .mode-home .person-summary { background: #fff5f1; color: #9f432e; }
    .person-summary:empty { display: none; }
    .year-roster { margin: 0 34px; padding: 20px 0 26px; border-top: 1px solid var(--line); }
    .year-roster-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .year-roster h2 { margin-bottom: 0; font-size: 20px; }
    .year-roster table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .year-roster th, .year-roster td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
    .year-roster th { color: var(--muted); font-size: 11px; }
    .year-roster td { font-size: 13px; }
    .year-roster th:first-child, .year-roster td:first-child { width: 42%; padding-left: 0; font-weight: 700; }
    .year-roster th:last-child, .year-roster td:last-child { width: 58%; text-align: center; }
    .year-roster.home-summary th:first-child, .year-roster.home-summary td:first-child { width: 58%; }
    .year-roster.home-summary th:last-child, .year-roster.home-summary td:last-child { width: 42%; }
    .vacation-balance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 5px; }
    .balance-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.2; }
    .balance-stat strong { font-size: 13px; }
    .balance-stat small, .quota-edit { color: var(--muted); font-size: 9px; }
    .balance-over strong, .balance-over small { color: var(--coral); }
    .quota-edit { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .quota-edit input { width: 58px; max-width: 100%; height: 28px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: white; color: var(--ink); font-size: 11px; text-align: center; }
    .roster-note, .roster-empty { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .holiday-legend { display: inline-flex; align-items: center; gap: 7px; }
    .holiday-legend-mark { width: 10px; height: 10px; border: 1px solid #e8cc82; border-radius: 3px; background: var(--gold-soft); }
    .calendar-legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .calendar-legend > span { display: inline-flex; align-items: center; gap: 5px; }
    .calendar-state-mark { width: 10px; height: 10px; border: 1px solid var(--line); border-radius: 3px; }
    .calendar-state-mark.today { border-color: #e6c46e; background: var(--gold-soft); }
    .calendar-state-mark.state-weekend { background: #f0f2ed; }
    .calendar-state-mark.state-holiday { border-color: #e8cc82; background: var(--gold-soft); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; display: flex; max-width: calc(100vw - 40px); align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #43534b; border-radius: 8px; background: var(--ink); color: white; box-shadow: 0 8px 26px rgb(22 38 29 / 22%); }
    .toast span { font-size: 13px; line-height: 1.4; }
    .toast button { min-height: 32px; padding: 6px 10px; border: 0; border-radius: 5px; background: var(--gold-soft); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 800; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgb(25 36 31 / 55%); }
    .vacation-dialog { width: min(1040px, 100%); max-height: min(90vh, 900px); overflow: auto; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
    .vacation-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 12px; }
    .vacation-dialog h2 { margin: 0 0 7px; font-size: 25px; }
    .vacation-dialog-summary { margin: 0; color: var(--muted); font-size: 13px; }
    .dialog-close { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: white; cursor: pointer; font-size: 20px; }
    .year-calendar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .mini-month { min-width: 0; padding: 11px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .mini-month h3 { margin: 0 0 9px; font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
    .mini-weekdays, .mini-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .mini-weekdays { margin-bottom: 4px; }
    .mini-weekday { color: var(--muted); font-size: 9px; font-weight: 800; text-align: center; }
    .mini-day { display: grid; aspect-ratio: 1; min-width: 0; place-items: center; border-radius: 4px; color: var(--ink); font-size: 10px; }
    .mini-day.empty { visibility: hidden; }
    .mini-day.weekend { color: #929b95; background: #f3f5f1; }
    .mini-day.holiday { position: relative; box-shadow: inset 0 0 0 1px #c2942f; }
    .mini-day.holiday::after { position: absolute; right: 2px; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: #9b7018; content: ""; }
    .mini-day.vacation { background: var(--person-color); color: var(--person-ink); font-weight: 800; }
    .vacation-dialog-legend { display: flex; align-items: center; gap: 7px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .vacation-legend-swatch { width: 13px; height: 13px; border-radius: 4px; background: var(--person-color); }
    .holiday-legend-swatch { width: 10px; height: 10px; border: 1px solid #c2942f; border-radius: 50%; background: var(--gold-soft); }
    @media (max-width: 700px) { .year-calendar-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 480px) { .vacation-dialog { padding: 17px 12px; } .year-calendar-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .mini-month { padding: 8px; } }
    .storage-note { padding: 13px 34px; border-top: 1px solid var(--line); background: #f8faf5; color: var(--muted); font-size: 11px; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 560px); padding-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 13px; }
      .mode-switch { width: 100%; }
      .mode-button { flex: 1; }
      .page-intro { padding: 27px 22px 23px; }
      .team-grid { gap: 9px; padding: 18px 18px 23px; }
      .team-card { min-height: 95px; gap: 8px; padding: 13px; }
      .team-card-copy { gap: 9px; }
      .team-icon { width: 38px; height: 38px; }
      .team-title { font-size: 15px; }
      .team-caption { font-size: 10px; }
      .team-count { min-width: 36px; }
      .team-count strong { font-size: 18px; }
      .team-count span { font-size: 9px; }
      .subhead { padding: 18px 19px 16px; }
      .subhead-row { align-items: flex-start; flex-direction: column; }
      .subhead h1 { font-size: 26px; }
      .month-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 18px; }
      .month-card { min-height: 86px; padding: 11px; }
      .month-name { font-size: 17px; }
      .calendar-tools { align-items: stretch; flex-direction: column; gap: 12px; padding: 17px 19px; }
      .person-field { width: 100%; }
      .responsible-settings, .approval-panel { padding-right: 19px; padding-left: 19px; }
      .mode-hint { max-width: none; text-align: left; }
      .person-summary { padding: 12px 19px; }
      .year-roster { margin: 0 19px; }
      .year-roster th, .year-roster td { padding: 8px 4px; font-size: 11px; }
      .year-roster th:first-child, .year-roster td:first-child { width: 36%; padding-left: 0; }
      .calendar-wrap { padding: 15px 12px 22px; }
      .weekdays, .days-grid { gap: 4px; }
      .weekday { font-size: 9px; }
      .day-cell { min-height: 58px; gap: 5px; padding: 6px; }
      .day-number { font-size: 11px; }
      .marker { min-width: 19px; height: 17px; font-size: 8px; }
      .storage-note { padding: 12px 19px; }
    }
    @media (max-width: 390px) {
      .team-card { align-items: flex-start; flex-direction: column; }
      .team-count { display: none; }
      .team-card-copy { align-items: flex-start; flex-direction: column; }
      .day-cell { min-height: 51px; padding: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <script>
    const teams = ["GT", "EJ", "Jud", "Apoio"];
    const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const weekdays = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
    const storageKey = "calendario-equipa-marcacoes-v1";
    const nameKey = "calendario-equipa-nome-v1";
    const quotaStorageKey = "calendario-equipa-quotas-v1";
    const responsibleStorageKey = "calendario-equipa-responsaveis-v1";
    const app = document.querySelector("#app");
    const state = { page: "teams", team: "", month: 0, year: new Date().getFullYear(), mode: "ferias", person: localStorage.getItem(nameKey) || "", vacationDetailPerson: "", toastMessage: "", toastUndo: false };
    let entries = loadEntries();
    let vacationQuotas = loadVacationQuotas();
    let areaResponsibles = loadAreaResponsibles();
    let lastAction = null;
    let toastTimer;

    function loadEntries() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || "[]");

      const items = pending.map((entry, index) => {
        const day = Number(entry.date.slice(-2));
        return `<div class="approval-item"><span class="approval-item-copy">${escapeHTML(entry.person)} · ${day} de ${months[state.month]} · ${entry.mode === "ferias" ? "Férias" : "Home office"}<small>Pendente de aprovação</small></span><span class="approval-actions" data-approval-actions${canApprove ? "" : " hidden"}><button data-approve="${index}">Aprovar</button><button class="reject-button" data-reject="${index}">Rejeitar</button></span></div>`;
      }).join("");
      const note = responsible
        ? canApprove
          ? `Responsável desta equipa: ${escapeHTML(responsible)}.`
          : `Só ${escapeHTML(responsible)} pode aprovar ou rejeitar. Indique esse nome no campo de identificação das marcações.`
        : "Ainda não foi definido um responsável para esta equipa. Configure-o na página da equipa.";
      return `<section class="approval-panel" aria-label="Aprovação de marcações"><h2>Marcações pendentes (${pending.length})</h2><p class="approval-note">${note} Esta validação é apenas uma demonstração local, não autentica utilizadores.</p><div class="approval-list">${items}</div></section>`;
    }
    function calendarPage() {
      const monthEntries = matchingEntries(state.team, state.year, state.month, state.mode);
      const confirmed = confirmedEntries(monthEntries);
      const total = state.mode === "ferias" ? countWorkingDays(confirmed, state.year) : confirmed.length;
      return `<section class="surface">
        <div class="subhead">${breadcrumbs(`${months[state.month]} ${state.year}`)}<div class="subhead-row"><div><p class="eyebrow">Equipa ${escapeHTML(state.team)} · ${currentModeLabel()}</p><h1>${months[state.month]} ${state.year}</h1></div>${monthStepper()}</div></div>
        <div class="calendar-tools"><div class="person-field"><label for="person-name">Nome para identificar as marcações</label><input id="person-name" list="known-people" type="text" maxlength="60" autocomplete="name" placeholder="Ex.: Ana Silva" value="${escapeHTML(state.person)}"><datalist id="known-people">${yearSummary(state.team, state.year).map((person) => `<option value="${escapeHTML(person.name)}"></option>`).join("")}</datalist></div><p class="mode-hint">As novas marcações ficam pendentes até à aprovação do responsável da equipa. Pode escolher um nome já registado.</p></div>
        <p class="person-summary" id="person-summary" aria-live="polite">${escapeHTML(personSummaryText())}</p>
        <div class="calendar-wrap"><div class="weekdays">${weekdays.map((day) => `<div class="weekday">${day}</div>`).join("")}</div><div class="days-grid">${calendarDays()}</div>
          <div class="calendar-footer"><span class="legend"><span class="legend-dot"></span>${modeDayLabel(state.mode, total)} confirmados neste mês · pendentes assinalados a dourado</span><span class="calendar-legend"><span><i class="calendar-state-mark today"></i>Hoje</span><span><i class="calendar-state-mark state-weekend"></i>Fim de semana</span><span><i class="calendar-state-mark state-holiday"></i>Feriado nacional</span></span></div>
        </div>
        ${approvalPanel()}
        ${yearRoster(state.team, state.year)}
        <div class="storage-note">Dados guardados apenas neste navegador e dispositivo. Os nomes de responsável são uma validação demonstrativa: sem autenticação e servidor, qualquer utilizador deste navegador pode imitá-los.</div>
      </section>`;
    }
    function render() {
      app.className = `shell mode-${state.mode === "home" ? "home" : "vac"}`;
      const page = state.page === "teams" ? teamPage() : state.page === "months" ? monthPage() : calendarPage();
      const toast = state.toastMessage ? `<div class="toast" role="status" aria-live="polite"><span>${escapeHTML(state.toastMessage)}</span>${state.toastUndo && lastAction ? `<button data-undo="true">Anular</button>` : ""}</div>` : "";
      app.innerHTML = `${header()}${page}${toast}${vacationDetailModal()}`;
    }

    app.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (event.target.matches("[data-detail-backdrop]")) {
        state.vacationDetailPerson = "";
        render();
        return;
      }
      if (!button) return;
      if (button.hasAttribute("data-close-detail")) {
        state.vacationDetailPerson = "";
        render();
        return;
      }
      if (button.dataset.vacationPerson) {
        state.vacationDetailPerson = button.dataset.vacationPerson;
        state.person = button.dataset.vacationPerson;
        localStorage.setItem(nameKey, state.person);
        render();
        document.querySelector(".dialog-close")?.focus();
        return;
      }
      if (button.dataset.undo) {
        undoLastAction();
        return;
      }
      if (button.hasAttribute("data-save-responsible")) {
        const input = document.querySelector("#area-responsible");
        const name = input.value.trim();
        if (name) areaResponsibles[state.team] = name;
        else delete areaResponsibles[state.team];
        saveAreaResponsibles();
        showToast(name ? `Responsável da Equipa ${state.team} guardado.` : "Responsável removido.");
        render();
        return;
      }
      if (button.dataset.approve !== undefined || button.dataset.reject !== undefined) {
        const pending = entries.filter((entry) => entry.team === state.team && entry.date.startsWith(`${state.year}-${String(state.month + 1).padStart(2, "0")}-`) && entry.status === "pendente");
        const index = Number(button.dataset.approve ?? button.dataset.reject);
        const entry = pending[index];
        if (!entry) return;
        if (!isAreaResponsible(state.team, state.person)) {
          showToast(`Apenas o responsável atribuído à Equipa ${state.team} pode validar.`);
          render();
          return;
        }
        if (button.dataset.approve !== undefined) {
          entry.status = "aprovada";
          showToast("Marcação aprovada.");
        } else {
          entries.splice(entries.indexOf(entry), 1);
          showToast("Marcação rejeitada.");
        }
        saveEntries();
        render();
        return;
      }
      if (button.dataset.mode) state.mode = button.dataset.mode;
      if (button.dataset.team) { state.team = button.dataset.team; state.page = "months"; }
      if (button.dataset.month !== undefined) { state.month = Number(button.dataset.month); state.page = "calendar"; }
      if (button.dataset.monthOffset !== undefined) {
        const adjacentMonth = new Date(state.year, state.month + Number(button.dataset.monthOffset), 1);
        state.year = adjacentMonth.getFullYear();
        state.month = adjacentMonth.getMonth();
      }
      if (button.dataset.page) state.page = button.dataset.page;
      if (button.dataset.year) state.year += Number(button.dataset.year);
      if (button.dataset.day) {
        const person = state.person.trim();
        if (!person) {
          const input = document.querySelector("#person-name");
          input.focus();
          input.setCustomValidity("Indique o seu nome antes de marcar dias.");
          input.reportValidity();
          return;
        }
        const date = dateKey(Number(button.dataset.day));
        const existingIndex = entries.findIndex((entry) => entry.team === state.team && entry.date === date && entry.person.toLocaleLowerCase("pt-PT") === person.toLocaleLowerCase("pt-PT"));
        const previous = existingIndex >= 0 ? { ...entries[existingIndex] } : null;
        const removed = existingIndex >= 0 && entries[existingIndex].mode === state.mode;
        if (removed) entries.splice(existingIndex, 1);
        else if (existingIndex >= 0) entries[existingIndex] = { ...entries[existingIndex], mode: state.mode, person, status: "pendente" };
        else entries.push({ team: state.team, date, person, mode: state.mode, status: "pendente" });
        saveEntries();
        lastAction = { team: state.team, date, person, previous };
        let message = removed ? "Marcação retirada." : "Marcação enviada para aprovação.";
        if (state.mode === "ferias") {
          const personYear = yearSummary(state.team, state.year).find((entry) => entry.name.toLocaleLowerCase("pt-PT") === person.toLocaleLowerCase("pt-PT"));
          if (personYear?.quota !== undefined && personYear.vacationDays > personYear.quota) message = `Quota excedida em ${personYear.vacationDays - personYear.quota} dia(s).`;
        }
        showToast(message, true);
      }
      render();
    });
    app.addEventListener("input", (event) => {
      if (event.target.id === "person-name") {
        state.person = event.target.value;
        localStorage.setItem(nameKey, state.person);
        event.target.setCustomValidity("");
        document.querySelector("#person-summary").textContent = personSummaryText();
        const canApprove = isAreaResponsible(state.team, state.person);
        document.querySelectorAll("[data-approval-actions]").forEach((actions) => { actions.hidden = !canApprove; });
        const approvalNote = document.querySelector(".approval-note");
        const responsible = areaResponsibles[state.team]?.trim();
        if (approvalNote && responsible) {
          approvalNote.textContent = `${canApprove ? `Responsável desta equipa: ${responsible}.` : `Só ${responsible} pode aprovar ou rejeitar. Indique esse nome no campo de identificação das marcações.`} Esta validação é apenas uma demonstração local, não autentica utilizadores.`;
        }
      }
    });
    app.addEventListener("change", (event) => {
      const input = event.target;
      if (input.classList.contains("quota-input")) {
        const value = input.value.trim();
        const key = quotaKey(input.dataset.quotaTeam, Number(input.dataset.quotaYear), input.dataset.quotaPerson);
        if (value === "") delete vacationQuotas[key];
        else {
          const quota = Number(value);
          if (!Number.isInteger(quota) || quota < 0 || quota > 366) {
            input.setCustomValidity("Indique uma quota entre 0 e 366 dias.");
            input.reportValidity();
            return;
          }
          vacationQuotas[key] = quota;
        }
        saveVacationQuotas();
        showToast("Quota de férias guardada.");
        render();
        return;
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.vacationDetailPerson) {
        state.vacationDetailPerson = "";
        render();
      }
    });
    render();
  </script>
</body>
</html>
