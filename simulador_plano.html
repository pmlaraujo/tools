 <!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <title>Simulador de Plano de Pagamentos</title>

  <!-- jsPDF -->

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

  <style>

      background: #f4f4f4;
      font-size: 20px;

      width: 100%;
      max-width: 1200px;
      background: white;
      padding: 40px 80px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
      border: 6px solid #b8bcc9;

      border-radius: 20px;
      padding: 24px 30px;
      margin-bottom: 30px;
      color: #ffffff;

      border-radius: 10px;
      border: 2px solid #bfc3cf;

      padding: 14px 26px;
      font-size: 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: bold;

    tbody tr:nth-child(even) { background: #f5f7fa; }
    tbody tr:hover { background: #e8ecff; }
    .editable-input {
      width: 100%;
      border-radius: 8px;
      border: 2px solid #bfc3cf;
      padding: 8px 10px;
      font-size: 16px;
      text-align: right;
    }
    .table-total td {
      background: rgb(0,122,130);
      color: white;
      font-weight: bold;
      border-top: 3px solid rgb(0,122,130);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title-box">
      <h1>Simulador de Plano de Pagamentos</h1>
    </div>

    <!-- Linha 1: Nome + NIF -->
    <div class="row">
      <div class="field field-nome">
        <label>Nome do Cliente</label>
        <input id="nomeCliente" type="text" />
      </div>
      <div class="field field-nif">
        <label>NIF</label>
        <input id="nifCliente" type="text" maxlength="9"
               oninput="this.value=this.value.replace(/\D/g,'').slice(0,9);" />
      </div>
    </div>

    <!-- Linha 2: Capital + Juros&Despesas + TAN + Data de incumprimento -->
    <div class="row">
      <div class="field">
        <label>Capital (€)</label>
        <input id="capital" type="number" step="0.01" />
      </div>
      <div class="field">
        <label>Juros, Despesas, Fees (€)</label>
        <input id="jurosDespesas" type="number" step="0.01" value="0" />
      </div>
      <div class="field">
        <label>TAN (%)</label>
        <input id="taxaAnual" type="number" step="0.01" value="4" />
      </div>
      <div class="field">
        <label>Data de incumprimento</label>
        <input id="dataIncumprimento" type="text" placeholder="dd/mm/yyyy" />
      </div>
    </div>

    <!-- Linha 3: Primeira prestação + restantes campos -->
    <div class="row">
      <div class="field">
        <label>Primeira prestação</label>
        <input id="primeiraData" type="text" placeholder="dd/mm/yyyy" />
      </div>
      <div class="field">
        <label>Tipo de cálculo</label>
        <select id="tipoCalculo">
          <option value="A">Por prazo (calcular prestação)</option>
          <option value="A2">Prestação definida (prazo calculado)</option>
        </select>
      </div>
      <div class="field" id="campoPrazo">
        <label>N.º de prestações</label>
        <input id="numPrestacoes" type="number" />
      </div>
      <div class="field" id="campoPrestacao" style="display:none;">
        <label>Valor da prestação (€)</label>
        <input id="valorPrestacao" type="number" step="0.01" />
      </div>
      <div class="field">
        <label>Periodicidade</label>
        <select id="periodicidade">
          <option value="1">Mensal</option>
          <option value="3">Trimestral</option>
          <option value="6">Semestral</option>
          <option value="12">Anual</option>
        </select>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-primary" id="btnCalcular">Calcular</button>
      <button class="btn-secondary" id="btnLimpar">Limpar</button>
      <button class="btn-secondary" id="btnPDF">Exportar PDF</button>
    </div>

    <div id="resumoCabecalho" class="summary-block" style="display:none;"></div>

    <table id="tabela" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Data</th>
          <th>Prestação (€)</th>
          <th>J,D,F (€)</th>
          <th>Juros (€)</th>
          <th>I.S. (€)</th>
          <th>Capital (€)</th>
          <th>Saldo Capital (€)</th>
          <th>Saldo J,D,F (€)</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

<script>
/* ============================================================
   Datas PT
============================================================ */
function pad2(n){ return String(n).padStart(2,'0'); }
function formatDatePT(d){ return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
function parseDataPT(str) {
  if (!str || !/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return null;
  const [dd, mm, yyyy] = str.split('/').map(Number);
  const dt = new Date(yyyy, mm - 1, dd);
  if (dt.getFullYear() !== yyyy || dt.getMonth() !== (mm - 1) || dt.getDate() !== dd) return null;
  return dt;
}

/* ============================================================
   Valores
============================================================ */
function formatMoney(v) {
  return (Number(v) || 0).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatMoneyInput(v) {
  return formatMoney(v).replace(/\./g, '');
}
function parseMoneyInput(v) {
  if (typeof v === 'number') return v;
  const s = String(v).trim().replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}
function roundUp2(v) { return Math.ceil((Number(v) || 0) * 100) / 100; }
function round2(v) { return Math.round(((Number(v) || 0) + Number.EPSILON) * 100) / 100; }
function zeroIfTiny(v) { return Math.abs(v) < 0.005 ? 0 : v; }

/* ============================================================
   Juros por dias (ACT/360)
============================================================ */
function diasEntreDatasUTC(d1, d2) {
  const utc1 = Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate());
  const utc2 = Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
  const msDia = 1000 * 60 * 60 * 24;
  return Math.max(0, Math.floor((utc2 - utc1) / msDia));
}
function jurosPorDiasACT360(saldoCapital, taxaAnual, dataInicio, dataFim) {
  const dias = diasEntreDatasUTC(dataInicio, dataFim);
  const juros = saldoCapital * (taxaAnual / 100) * (dias / 360);
  return { dias, juros };
}
function textoPeriodicidade(meses) {
  return meses === 1 ? 'Mensal' : meses === 3 ? 'Trimestral' : meses === 6 ? 'Semestral' : 'Anual';
}

/* ============================================================
   Motor de cálculo (REGRA CORRIGIDA)
   - Enquanto Saldo J&D > Prestação:
       * prestação é aplicada exclusivamente a J&D
       * Juros+IS do período são agregados ao Saldo J&D
       * colunas Juros e IS ficam a 0 (para não parecer amortização)
       * Capital não é amortizado
   - Caso contrário:
       * paga J&D, depois Juros+IS, depois Capital
       * encargos não pagos acumulam em J&D (sem capitalizar)
============================================================ */
function simularPlano({
  capitalInicial, jdInicial, PMT, taxaAnual, primeiraData,
  mesesPeriodo, nMax = null, dataInc = null, maxIter = 600
}) {
  let saldoCapital = round2(capitalInicial);
  let saldoJD = round2(jdInicial);
  let encargosEmDivida = 0;

  const linhas = [];
  let k = 0;
  let dataAnterior = null;

  while (
    (nMax ? k < nMax : (saldoCapital > 0.005 || saldoJD > 0.005 || encargosEmDivida > 0.005))
    && k < maxIter
  ) {
    const dataVenc = new Date(primeiraData);
    dataVenc.setMonth(dataVenc.getMonth() + k * mesesPeriodo);

    /* Juros apenas sobre capital */
    let juros = 0;
    if (saldoCapital > 0.005) {
      if (dataInc) {
        const inicio = (k === 0 ? dataInc : dataAnterior);
        juros = jurosPorDiasACT360(saldoCapital, taxaAnual, inicio, dataVenc).juros;
      } else {
        juros = saldoCapital * (taxaAnual / 100) * (mesesPeriodo / 12);
      }
    }
    juros = round2(juros);
    let imposto = round2(juros * 0.04);
    let encargosPeriodo = round2(juros + imposto);
    encargosEmDivida = round2(encargosEmDivida + encargosPeriodo);

    let prestacao = round2(Math.min(
      PMT,
      saldoJD + encargosEmDivida + saldoCapital
    ));

    let restante = prestacao;

    /* 1️⃣ J&D (fixo, nunca aumenta) */
    let pagoJD = round2(Math.min(restante, saldoJD));
    saldoJD = round2(saldoJD - pagoJD);
    restante = round2(restante - pagoJD);

    /* 2️⃣ Encargos */
    let pagoEncargos = round2(Math.min(restante, encargosEmDivida));
    encargosEmDivida = round2(encargosEmDivida - pagoEncargos);
    restante = round2(restante - pagoEncargos);

    /* 3️⃣ Capital */
    let amortizacao = round2(Math.min(restante, saldoCapital));
    saldoCapital = round2(saldoCapital - amortizacao);

    saldoCapital = zeroIfTiny(saldoCapital);
    saldoJD = zeroIfTiny(saldoJD);
    encargosEmDivida = zeroIfTiny(encargosEmDivida);

    linhas.push({
      parcela: k + 1,
      data: dataVenc,
      prestacao,
      jd: pagoJD,
      juros,
      impostoSelo: imposto,
      amortizacao,
      saldoCapitalDepois: saldoCapital,
      saldoJDDepois: saldoJD
    });

    dataAnterior = dataVenc;
    k++;
  }

  return linhas;
}
/* ============================================================
   Solver PMT (quando o utilizador dá o prazo)
============================================================ */
function calcularPMTComJD({ capitalInicial, jdInicial, n, taxaAnual, mesesPeriodo, dataInc, primeiraData }) {
  // Caso especial 1 prestação
  if (n === 1) {
    let juros0 = 0;
    if (capitalInicial > 0.005) {
      if (dataInc) {
        juros0 = jurosPorDiasACT360(capitalInicial, taxaAnual, dataInc, primeiraData).juros;
      } else {
        const i = (taxaAnual / 100) * (mesesPeriodo / 12);
        juros0 = capitalInicial * i;
      }
    }
    juros0 = round2(juros0);
    const is0 = round2(juros0 * 0.04);
    return round2(capitalInicial + jdInicial + juros0 + is0);
  }

  let baixo = 0.01;
  let alto = (capitalInicial + jdInicial) * 2 + 1000;
  let PMT = 0;

  for (let iter = 0; iter < 70; iter++) {
    PMT = (baixo + alto) / 2;
    const plano = simularPlano({
      capitalInicial,
      jdInicial,
      PMT,
      taxaAnual,
      primeiraData,
      mesesPeriodo,
      nMax: n,
      dataInc,
      maxIter: n
    });
    const last = plano[plano.length - 1] || null;
    const saldoFinalCapital = last ? last.saldoCapitalDepois : capitalInicial;
    const saldoFinalJD = last ? last.saldoJDDepois : jdInicial;
    const saldoFinalTotal = saldoFinalCapital + saldoFinalJD;

    if (saldoFinalTotal > 0.0001) baixo = PMT;
    else alto = PMT;
  }

  return PMT;
}

/* ============================================================
   Elementos
============================================================ */
const tipoCalculoEl = document.getElementById('tipoCalculo');
const campoPrazo = document.getElementById('campoPrazo');
const campoPrestacao = document.getElementById('campoPrestacao');
const periodicidadeEl = document.getElementById('periodicidade');
const tbody = document.getElementById('tbody');
const tabela = document.getElementById('tabela');
const resumoCabecalho = document.getElementById('resumoCabecalho');

const nomeInput = document.getElementById('nomeCliente');
const nifInput = document.getElementById('nifCliente');
const capitalInput = document.getElementById('capital');
const jdInput = document.getElementById('jurosDespesas');
const taxaInput = document.getElementById('taxaAnual');
const dataIncInput = document.getElementById('dataIncumprimento');
const primeiraDataInput = document.getElementById('primeiraData');
const numPrestInput = document.getElementById('numPrestacoes');
const valorPrestInput = document.getElementById('valorPrestacao');

const btnCalcular = document.getElementById('btnCalcular');
const btnLimpar = document.getElementById('btnLimpar');
const btnPDF = document.getElementById('btnPDF');

/* Estado */
let planoAtual = [];
let capitalAtual = 0;
let jdAtual = 0;
let taxaAtual = 0;
let primeiraDataAtual = null;
let mesesPeriodoAtual = 1;
let dataIncAtual = null;

tipoCalculoEl.addEventListener('change', () => {
  campoPrazo.style.display = tipoCalculoEl.value === 'A' ? '' : 'none';
  campoPrestacao.style.display = tipoCalculoEl.value === 'A2' ? '' : 'none';
});

function atualizarResumo(nome, nif, capital, jd, taxa, dataIncStr, primeiraDataStr, tipo, n) {
  const dInc = parseDataPT(dataIncStr);
  const d1 = parseDataPT(primeiraDataStr);
  const incFmt = dInc ? formatDatePT(dInc) : '-';
  const primeiraFmt = d1 ? formatDatePT(d1) : '-';
  let extra = '';

  if (dInc && d1 && capital > 0) {
    const calc = jurosPorDiasACT360(capital, taxa, dInc, d1);
    const juros = round2(calc.juros);
    const imposto = round2(juros * 0.04);
    extra =
      `<br><b>Juros desde incumprimento até 1.ª prestação (sobre Capital):</b> ${calc.dias} dias ` +
      `<b>Juros:</b> ${formatMoney(juros)} €  <b>I.S.:</b> ${formatMoney(imposto)} €`;
  }

  resumoCabecalho.innerHTML =
    `<b>Cliente:</b> ${nome || '-'}  <b>NIF:</b> ${nif || '-'}<br>` +
    `<b>Capital:</b> ${formatMoney(capital)} €  <b>Juros, Despesas, Fees:</b> ${formatMoney(jd)} €  <b>TAN:</b> ${taxa}%<br>` +
    `<b>Data de incumprimento:</b> ${incFmt}  <b>Primeira prestação:</b> ${primeiraFmt}<br>` +
    `<b>Tipo de cálculo:</b> ${tipo === 'A' ? 'Por prazo' : 'Prestação definida'}  ` +
    `<b>N.º prestações:</b> ${n}  ` +
    `<b>Periodicidade:</b> ${textoPeriodicidade(mesesPeriodoAtual)}` +
    extra;

  resumoCabecalho.style.display = 'block';
}

function preencherTabela(plano) {
  tbody.innerHTML = '';
  const tfoot = document.getElementById('tfoot');
  tfoot.innerHTML = '';

  plano.forEach((l) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${l.parcela}</td>
      <td>${formatDatePT(l.data)}</td>
      <td><input class="editable-input" type="text"
          value="${formatMoneyInput(l.prestacao)}"
          onchange="editarPrestacao(this.value, ${l.parcela})"></td>
      <td>${formatMoney(l.jd || 0)}</td>
      <td>${formatMoney(l.juros || 0)}</td>
      <td>${formatMoney(l.impostoSelo || 0)}</td>
      <td>${formatMoney(l.amortizacao || 0)}</td>
      <td>${formatMoney(l.saldoCapitalDepois || 0)}</td>
      <td>${formatMoney(l.saldoJDDepois || 0)}</td>
    `;
    tbody.appendChild(tr);
  });

  if (plano.length) {
    const totalPrestacao = plano.reduce((s, l) => s + Number(l.prestacao || 0), 0);
    const totalJD = plano.reduce((s, l) => s + Number(l.jd || 0), 0);
    const totalJuros = plano.reduce((s, l) => s + Number(l.juros || 0), 0);
    const totalIS = plano.reduce((s, l) => s + Number(l.impostoSelo || 0), 0);
    const totalCapital = plano.reduce((s, l) => s + Number(l.amortizacao || 0), 0);
    const saldoFinalCapital = plano[plano.length - 1]?.saldoCapitalDepois || 0;
    const saldoFinalJD = plano[plano.length - 1]?.saldoJDDepois || 0;

    tfoot.innerHTML = `
      <tr class="table-total">
        <td><strong>Total</strong></td>
        <td></td>
        <td><strong>${formatMoney(totalPrestacao)}</strong></td>
        <td><strong>${formatMoney(totalJD)}</strong></td>
        <td><strong>${formatMoney(totalJuros)}</strong></td>
        <td><strong>${formatMoney(totalIS)}</strong></td>
        <td><strong>${formatMoney(totalCapital)}</strong></td>
        <td></td>
        <td></td>
      </tr>
    `;
  }

  tabela.style.display = plano.length ? 'table' : 'none';
}

function calcular() {
  const nome = nomeInput.value;
  const nif = nifInput.value;
  const capital = Number(capitalInput.value);
  const jd = Number(jdInput.value || 0);
  const taxa = Number(taxaInput.value);
  const dataIncStr = (dataIncInput.value || '').trim();
  const primeiraDataStr = (primeiraDataInput.value || '').trim();
  const mesesPeriodo = Number(periodicidadeEl.value);

  if (!capital || !taxa || !primeiraDataStr) {
    alert('Preenche Capital, TAN e a data da primeira prestação.');
    return;
  }
  if (capital < 0 || jd < 0) {
    alert('Capital e Juros, Despesas, Fees não podem ser negativos.');
    return;
  }

  const primeiraData = parseDataPT(primeiraDataStr);
  if (!primeiraData) {
    alert('Data da primeira prestação inválida. Usa dd/mm/yyyy.');
    return;
  }

  let dataInc = null;
  if (dataIncStr) {
    dataInc = parseDataPT(dataIncStr);
    if (!dataInc) {
      alert('Data de incumprimento inválida. Usa dd/mm/yyyy.');
      return;
    }
    if (dataInc > primeiraData) {
      alert('A data de incumprimento não pode ser posterior à data da primeira prestação.');
      return;
    }
  }

  let PMT, n;
  const tipo = tipoCalculoEl.value;

  if (tipo === 'A') {
    n = Number(numPrestInput.value);
    if (!n || n <= 0) {
      alert('Indica o número de prestações.');
      return;
    }
    PMT = roundUp2(calcularPMTComJD({
      capitalInicial: capital,
      jdInicial: jd,
      n,
      taxaAnual: taxa,
      mesesPeriodo,
      dataInc,
      primeiraData
    }));

    planoAtual = simularPlano({
      capitalInicial: capital,
      jdInicial: jd,
      PMT,
      taxaAnual: taxa,
      primeiraData,
      mesesPeriodo,
      nMax: n,
      dataInc,
      maxIter: n
    });

  } else {
    PMT = Number(valorPrestInput.value);
    if (!PMT || PMT <= 0) {
      alert('Indica o valor da prestação.');
      return;
    }
    planoAtual = simularPlano({
      capitalInicial: capital,
      jdInicial: jd,
      PMT,
      taxaAnual: taxa,
      primeiraData,
      mesesPeriodo,
      nMax: null,
      dataInc,
      maxIter: 600
    });
    n = planoAtual.length;
  }

  capitalAtual = round2(capital);
  jdAtual = round2(jd);
  taxaAtual = taxa;
  primeiraDataAtual = primeiraData;
  mesesPeriodoAtual = mesesPeriodo;
  dataIncAtual = dataInc;

  atualizarResumo(nome, nif, capitalAtual, jdAtual, taxaAtual, dataIncStr, primeiraDataStr, tipo, n);
  preencherTabela(planoAtual);
}

/* ============================================================
   Edição de prestação (recalcula tudo com a nova prestação)
   (REGRA corrigida também aqui)
============================================================ */
window.editarPrestacao = function(novoValor, parcelaEditada) {
  novoValor = parseMoneyInput(novoValor);
  if (novoValor <= 0) { alert('Prestação inválida.'); preencherTabela(planoAtual); return; }

  let saldoCapital = round2(capitalAtual);
  let saldoJD = round2(jdAtual);
  const novoPlano = [];

  function dataParcela(idx1based){
    const d = new Date(primeiraDataAtual);
    d.setMonth(d.getMonth() + (idx1based - 1) * mesesPeriodoAtual);
    return d;
  }

  function jurosDoPeriodo(kZeroBased, dataVenc, dataAnterior) {
    if (saldoCapital <= 0.005) return 0;
    if (dataIncAtual) {
      const inicio = (kZeroBased === 0 ? dataIncAtual : dataAnterior);
      return jurosPorDiasACT360(saldoCapital, taxaAtual, inicio, dataVenc).juros;
    }
    const i = (taxaAtual / 100) * (mesesPeriodoAtual / 12);
    return saldoCapital * i;
  }

  function aplicarPrestacao(prestacao, kZeroBased, dataVenc, dataAnterior) {
    // calcular encargos
    let jurosCalc = round2(jurosDoPeriodo(kZeroBased, dataVenc, dataAnterior));
    let isCalc = round2(jurosCalc * 0.04);
    let encargosCalc = round2(jurosCalc + isCalc);

    // cap
    const total = round2(saldoJD + saldoCapital + encargosCalc);
    prestacao = round2(Math.min(prestacao, total));

    const saldoJDInicio = saldoJD;

    let pagoJD = 0;
    let jurosDisplay = jurosCalc;
    let isDisplay = isCalc;
    let amortizacao = 0;

    if (saldoJDInicio > prestacao) {
      // Exclusivo J&D
      pagoJD = prestacao;
      saldoJD = round2(saldoJD - pagoJD);
      saldoJD = round2(saldoJD + encargosCalc);

      jurosDisplay = 0;
      isDisplay = 0;
      amortizacao = 0;
    } else {
      let restante = prestacao;

      // 1) J&D
      pagoJD = round2(Math.min(restante, saldoJD));
      saldoJD = round2(saldoJD - pagoJD);
      restante = round2(restante - pagoJD);

      // 2) Encargos
      let encargosEmDivida = encargosCalc;
      const pagoEncargos = round2(Math.min(restante, encargosEmDivida));
      encargosEmDivida = round2(encargosEmDivida - pagoEncargos);
      restante = round2(restante - pagoEncargos);

      if (encargosEmDivida > 0.000001) {
        saldoJD = round2(saldoJD + encargosEmDivida);
      }

      // 3) Capital
      amortizacao = round2(Math.min(restante, saldoCapital));
      saldoCapital = round2(saldoCapital - amortizacao);
    }

    saldoCapital = zeroIfTiny(saldoCapital);
    saldoJD = zeroIfTiny(saldoJD);

    return { prestacao, pagoJD, jurosDisplay, isDisplay, amortizacao };
  }

  // Recalcular anteriores com prestações antigas
  let dataAnterior = null;
  for (let idx = 1; idx < parcelaEditada; idx++) {
    const antiga = planoAtual[idx - 1];
    const dataVenc = dataParcela(idx);
    const r = aplicarPrestacao(Number(antiga.prestacao), idx - 1, dataVenc, dataAnterior);
    novoPlano.push({
      parcela: idx,
      data: dataVenc,
      prestacao: r.prestacao,
      jd: r.pagoJD,
      juros: r.jurosDisplay,
      impostoSelo: r.isDisplay,
      amortizacao: r.amortizacao,
      saldoCapitalDepois: saldoCapital,
      saldoJDDepois: saldoJD
    });
    dataAnterior = dataVenc;
  }

  // Parcela editada
  {
    const idx = parcelaEditada;
    const dataVenc = dataParcela(idx);
    const r = aplicarPrestacao(novoValor, idx - 1, dataVenc, dataAnterior);
    novoPlano.push({
      parcela: idx,
      data: dataVenc,
      prestacao: r.prestacao,
      jd: r.pagoJD,
      juros: r.jurosDisplay,
      impostoSelo: r.isDisplay,
      amortizacao: r.amortizacao,
      saldoCapitalDepois: saldoCapital,
      saldoJDDepois: saldoJD
    });
    dataAnterior = dataVenc;
  }

  // Restantes até liquidar tudo (cap 240)
  let k = parcelaEditada;
  const limite = parcelaEditada + 240;
  while ((saldoCapital > 0.005 || saldoJD > 0.005) && k < limite) {
    k++;
    const dataVenc = dataParcela(k);
    const r = aplicarPrestacao(novoValor, k - 1, dataVenc, dataAnterior);
    novoPlano.push({
      parcela: k,
      data: dataVenc,
      prestacao: r.prestacao,
      jd: r.pagoJD,
      juros: r.jurosDisplay,
      impostoSelo: r.isDisplay,
      amortizacao: r.amortizacao,
      saldoCapitalDepois: saldoCapital,
      saldoJDDepois: saldoJD
    });
    dataAnterior = dataVenc;
  }

  planoAtual = novoPlano;
  preencherTabela(planoAtual);
  atualizarResumo(
    nomeInput.value, nifInput.value, capitalAtual, jdAtual, taxaAtual,
    (dataIncInput.value || '').trim(),
    (primeiraDataInput.value || '').trim(),
    tipoCalculoEl.value, planoAtual.length
  );
};

function limpar() {
  nomeInput.value = '';
  nifInput.value = '';
  capitalInput.value = '';
  jdInput.value = '0';
  taxaInput.value = '4';
  dataIncInput.value = '';
  primeiraDataInput.value = '';
  numPrestInput.value = '';
  valorPrestInput.value = '';
  periodicidadeEl.value = '1';

  tbody.innerHTML = '';
  tabela.style.display = 'none';
  resumoCabecalho.style.display = 'none';

  planoAtual = [];
  capitalAtual = 0;
  jdAtual = 0;
  taxaAtual = 0;
  primeiraDataAtual = null;
  mesesPeriodoAtual = 1;
  dataIncAtual = null;
}

btnCalcular.addEventListener('click', calcular);
btnLimpar.addEventListener('click', limpar);

/* Flatpickr */
function initCalendarioPT(selector) {
  flatpickr(selector, {
    locale: flatpickr.l10ns.pt,
    dateFormat: "d/m/Y",
    allowInput: true
  });
}
initCalendarioPT("#dataIncumprimento");
initCalendarioPT("#primeiraData");
</script>

<script>
/* ============================================================
   PDF
============================================================ */
btnPDF.addEventListener('click', () => {
  if (!planoAtual.length) { alert('Nada para exportar.'); return; }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const margin = 40;
  let y = 0;
  let page = 1;

  const nome = document.getElementById('nomeCliente').value || "-";
  const nif = document.getElementById('nifCliente').value || "-";
  const capital = formatMoney(Number(document.getElementById('capital').value) || 0);
  const jd = formatMoney(Number(document.getElementById('jurosDespesas').value) || 0);
  const taxa = document.getElementById('taxaAnual').value || "-";
  const dataIncStr = document.getElementById('dataIncumprimento').value ? document.getElementById('dataIncumprimento').value : "-";
  const primeiraDataStr = document.getElementById('primeiraData').value ? document.getElementById('primeiraData').value : "-";
  const tipo = document.getElementById('tipoCalculo').value;
  const n = planoAtual.length;

  const mesesPeriodoAtualLocal = Number(document.getElementById('periodicidade').value || 1);
  const periodicidadeTxt =
    mesesPeriodoAtualLocal === 1 ? 'Mensal' :
    mesesPeriodoAtualLocal === 3 ? 'Trimestral' :
    mesesPeriodoAtualLocal === 6 ? 'Semestral' : 'Anual';

  // Caixa resumo
  pdf.setFillColor(245, 245, 245);
  pdf.setDrawColor(180, 180, 180);
  pdf.roundedRect(margin, 40, pageWidth - margin * 2, 160, 6, 6, "FD");

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(16);
  pdf.text("Resumo Financeiro", margin + 10, 65);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(12);
  pdf.text(`Cliente: ${nome}`, margin + 10, 90);
  pdf.text(`NIF: ${nif}`, margin + 320, 90);
  pdf.text(`Capital: ${capital} €`, margin + 10, 110);
  pdf.text(`Juros, Despesas, Fees: ${jd} €`, margin + 320, 110);
  pdf.text(`TAN: ${taxa}%`, margin + 620, 110);
  pdf.text(`Data incumprimento: ${dataIncStr}`, margin + 10, 130);
  pdf.text(`Primeira prestação: ${primeiraDataStr}`, margin + 320, 130);
  pdf.text(`Tipo cálculo: ${tipo === 'A' ? 'Por prazo' : 'Prestação definida'}`, margin + 10, 150);
  pdf.text(`N.º prestações: ${n}`, margin + 320, 150);
  pdf.text(`Periodicidade: ${periodicidadeTxt}`, margin + 620, 150);

  y = 230;

  function desenharCabecalhoTabela() {
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(14);
    pdf.text("Plano Financeiro", margin, y);
    y += 20;

    pdf.setFontSize(10);
    const headers = [
      { label: "#", x: margin },
      { label: "Data", x: margin + 28 },
      { label: "Prestação", x: margin + 110 },
      { label: "J,D,F", x: margin + 200 },
      { label: "Juros", x: margin + 300 },
      { label: "I.S.", x: margin + 360 },
      { label: "Capital", x: margin + 420 },
      { label: "Saldo Capital", x: margin + 490 },
      { label: "Saldo J,D,F", x: margin + 610 }
    ];
    headers.forEach(h => pdf.text(h.label, h.x, y));
    pdf.setLineWidth(1);
    pdf.line(margin, y + 5, pageWidth - margin, y + 5);

    y += 22;
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(10);
  }

  function desenharPaginacao() {
    pdf.setFontSize(10);
    pdf.setFont("helvetica", "normal");
    pdf.text(`Pág. ${page}`, pageWidth - margin - 40, pageHeight - 20);
  }

  function desenharLinha(l) {
    const col = [
      { text: String(l.parcela), x: margin },
      { text: formatDatePT(l.data), x: margin + 28 },
      { text: formatMoney(l.prestacao), x: margin + 110 },
      { text: formatMoney(l.jd || 0), x: margin + 200 },
      { text: formatMoney(l.juros || 0), x: margin + 300 },
      { text: formatMoney(l.impostoSelo || 0), x: margin + 360 },
      { text: formatMoney(l.amortizacao || 0), x: margin + 420 },
      { text: formatMoney(l.saldoCapitalDepois || 0), x: margin + 490 },
      { text: formatMoney(l.saldoJDDepois || 0), x: margin + 610 }
    ];
    col.forEach(c => pdf.text(c.text, c.x, y));
    pdf.setLineWidth(0.5);
    pdf.line(margin, y + 5, pageWidth - margin, y + 5);
    y += 20;
  }

  desenharCabecalhoTabela();

  planoAtual.forEach((l) => {
    if (y > pageHeight - 60) {
      desenharPaginacao();
      pdf.addPage();
      page++;
      y = 40;
      desenharCabecalhoTabela();
    }
    desenharLinha(l);
  });

  desenharPaginacao();
  pdf.save("plano_pagamentos.pdf");
});
</script>

</body>
